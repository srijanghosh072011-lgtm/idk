<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090d" />
  <title>Gaffer — Football Management</title>
  <meta name="description" content="A football management career sim. Pick a club, set your tactics, run the transfer market, and sim your way through the season." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;color:#e7ecf3;background:#07090d">
      <h1>Gaffer</h1><p>This game needs JavaScript enabled. Please turn it on and reload.</p>
    </div>
  </noscript>

  <!-- Core models -->
  <script src="js/core/ratings.js"></script>
  <script src="js/core/player.js"></script>
  <script src="js/core/club.js"></script>
  <!-- Data -->
  <script src="js/data/clubs.js"></script>
  <script src="js/data/squads.js"></script>
  <!-- Engine -->
  <script src="js/engine/match.js"></script>
  <script src="js/engine/league.js"></script>
  <!-- Systems -->
  <script src="js/save/save.js"></script>
  <script src="js/main.js"></script>
  <!-- UI (must load after Game is defined) -->
  <script src="js/ui/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        Gaffer.UI.boot();
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div style="padding:40px;color:#e25563;font-family:monospace">Failed to start: ' + e.message + '</div>';
        console.error(e);
      }
    });
  </script>
</body>
</html>
