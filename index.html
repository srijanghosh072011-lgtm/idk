/* ============================================================================
 * league.js  —  Competition: fixtures, table, leaderboards
 * ----------------------------------------------------------------------------
 * Generates a double round-robin schedule (everyone plays everyone home & away),
 * maintains the league table from results, and rolls up scorer/assist/clean-sheet
 * leaderboards across the season.
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;

  function League(id, name, clubIds) {
    this.id = id;
    this.name = name;
    this.clubIds = clubIds.slice();
    this.fixtures = [];      // array of rounds; each round = array of {home, away, played, result}
    this.currentRound = 0;   // index into fixtures
    this.table = {};         // clubId -> row
    this._initTable();
    this.generateFixtures();
  }

  League.prototype._initTable = function () {
    var self = this;
    this.clubIds.forEach(function (id) {
      self.table[id] = { clubId: id, P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, Pts: 0, form: [] };
    });
  };

  // Circle method for round-robin scheduling, then mirror for the reverse half.
  League.prototype.generateFixtures = function () {
    var ids = this.clubIds.slice();
    if (ids.length % 2 !== 0) ids.push(null); // bye marker
    var n = ids.length;
    var rounds = [];
    var arr = ids.slice();

    for (var r = 0; r < n - 1; r++) {
      var round = [];
      for (var i = 0; i < n / 2; i++) {
        var a = arr[i], b = arr[n - 1 - i];
        if (a !== null && b !== null) {
          // Alternate home/away by round for fairness.
          if ((r + i) % 2 === 0) round.push({ home: a, away: b, played: false, result: null });
          else round.push({ home: b, away: a, played: false, result: null });
        }
      }
      rounds.push(round);
      // Rotate (keep first fixed).
      var fixed = arr[0];
      var rest = arr.slice(1);
      rest.unshift(rest.pop());
      arr = [fixed].concat(rest);
    }

    // Reverse fixtures (swap home/away) for the second half of the season.
    var reverse = rounds.map(function (round) {
      return round.map(function (m) { return { home: m.away, away: m.home, played: false, result: null }; });
    });

    this.fixtures = rounds.concat(reverse);
  };

  League.prototype.totalRounds = function () { return this.fixtures.length; };
  League.prototype.isComplete = function () { return this.currentRound >= this.fixtures.length; };
  League.prototype.roundFixtures = function (roundIndex) {
    return this.fixtures[roundIndex == null ? this.currentRound : roundIndex] || [];
  };

  // Find the round + fixture for a given club (used to know "your next match").
  League.prototype.nextFixtureFor = function (clubId) {
    for (var r = this.currentRound; r < this.fixtures.length; r++) {
      var fx = this.fixtures[r];
      for (var i = 0; i < fx.length; i++) {
        if (!fx[i].played && (fx[i].home === clubId || fx[i].away === clubId)) {
          return { round: r, fixture: fx[i] };
        }
      }
    }
    return null;
  };

  League.prototype.recordResult = function (fixture, result) {
    fixture.played = true;
    fixture.result = { homeScore: result.homeScore, awayScore: result.awayScore };
    this._applyToTable(fixture.home, fixture.away, result.homeScore, result.awayScore);
  };

  League.prototype._applyToTable = function (homeId, awayId, hs, as_) {
    var h = this.table[homeId], a = this.table[awayId];
    if (!h || !a) return;
    h.P++; a.P++;
    h.GF += hs; h.GA += as_; a.GF += as_; a.GA += hs;
    h.GD = h.GF - h.GA; a.GD = a.GF - a.GA;
    if (hs > as_) { h.W++; h.Pts += 3; a.L++; pushForm(h, 'W'); pushForm(a, 'L'); }
    else if (hs < as_) { a.W++; a.Pts += 3; h.L++; pushForm(a, 'W'); pushForm(h, 'L'); }
    else { h.D++; a.D++; h.Pts++; a.Pts++; pushForm(h, 'D'); pushForm(a, 'D'); }
  };

  function pushForm(row, r) { row.form.push(r); if (row.form.length > 5) row.form.shift(); }

  // Sorted table rows (Pts, GD, GF, name).
  League.prototype.standings = function (clubLookup) {
    var rows = Object.keys(this.table).map(function (id) { return this.table[id]; }, this).slice();
    rows.sort(function (a, b) {
      if (b.Pts !== a.Pts) return b.Pts - a.Pts;
      if (b.GD !== a.GD) return b.GD - a.GD;
      if (b.GF !== a.GF) return b.GF - a.GF;
      var an = clubLookup ? clubLookup(a.clubId).name : a.clubId;
      var bn = clubLookup ? clubLookup(b.clubId).name : b.clubId;
      return an < bn ? -1 : 1;
    });
    return rows;
  };

  // Build scorer/assist leaderboards from a list of all clubs' players.
  League.leaderboards = function (clubs) {
    var scorers = [], assists = [], cleanSheets = [];
    clubs.forEach(function (club) {
      club.players.forEach(function (p) {
        if (p.stats.goals > 0) scorers.push({ name: p.name, club: club.short, value: p.stats.goals, apps: p.stats.apps });
        if (p.stats.assists > 0) assists.push({ name: p.name, club: club.short, value: p.stats.assists, apps: p.stats.apps });
        if (p.line === 'GK' && p.stats.cleanSheets > 0) cleanSheets.push({ name: p.name, club: club.short, value: p.stats.cleanSheets, apps: p.stats.apps });
      });
    });
    function topSort(a, b) { return b.value - a.value || a.apps - b.apps; }
    scorers.sort(topSort); assists.sort(topSort); cleanSheets.sort(topSort);
    return { scorers: scorers.slice(0, 20), assists: assists.slice(0, 20), cleanSheets: cleanSheets.slice(0, 20) };
  };

  G.League = League;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================================
 * save.js  —  Persistence (localStorage)
 * ----------------------------------------------------------------------------
 * Stores serialized game state under named slots. Supports multiple save slots
 * plus a dedicated autosave slot. Falls back to an in-memory store when
 * localStorage is unavailable (e.g. running under node for tests).
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;

  var PREFIX = 'gaffer_save_';
  var memFallback = {};

  function store() {
    try {
      if (typeof localStorage !== 'undefined') return localStorage;
    } catch (e) { /* sandboxed */ }
    return {
      getItem: function (k) { return memFallback[k] != null ? memFallback[k] : null; },
      setItem: function (k, v) { memFallback[k] = v; },
      removeItem: function (k) { delete memFallback[k]; },
      get length() { return Object.keys(memFallback).length; },
      key: function (i) { return Object.keys(memFallback)[i]; }
    };
  }

  var Save = {
    save: function (slot, state) {
      var payload = { savedAt: Date.now(), meta: state._meta || {}, state: state };
      try {
        store().setItem(PREFIX + slot, JSON.stringify(payload));
        return true;
      } catch (e) {
        console.error('Save failed:', e);
        return false;
      }
    },
    load: function (slot) {
      var raw = store().getItem(PREFIX + slot);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    },
    has: function (slot) { return store().getItem(PREFIX + slot) != null; },
    remove: function (slot) { store().removeItem(PREFIX + slot); },
    list: function () {
      var s = store(), out = [];
      for (var i = 0; i < s.length; i++) {
        var key = s.key(i);
        if (key && key.indexOf(PREFIX) === 0) {
          var slot = key.slice(PREFIX.length);
          var data = null;
          try { data = JSON.parse(s.getItem(key)); } catch (e) {}
          out.push({ slot: slot, savedAt: data ? data.savedAt : 0, meta: data ? data.meta : {} });
        }
      }
      out.sort(function (a, b) { return b.savedAt - a.savedAt; });
      return out;
    }
  };

  G.Save = Save;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================================
 * main.js  —  Game controller / world state
 * ----------------------------------------------------------------------------
 * Builds the game world from the data files, drives the season round by round,
 * runs the user's match in full detail (for highlights) plus the rest of the
 * round, updates the table, recovers players, and handles save/load.
 * The UI layer (ui.js) calls into this; this module never touches the DOM.
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;

  var Game = {
    world: null,
    managerClubId: null,
    season: '2025-26',
    seasonStartYear: 2025,
    lastRound: null,        // { userResult, others: [results] }
    history: { results: [] }
  };

  // ---- World construction --------------------------------------------------
  Game.buildWorld = function () {
    var clubs = {}, list = [];
    G.DATA.clubs.forEach(function (cd) {
      var club = new G.Club(cd);
      var squad = G.DATA.squads[cd.id] || [];
      squad.forEach(function (rec, i) {
        var p = new G.Player(rec, cd.id);
        p.id = cd.id + '-' + i;                 // stable, deterministic id
        p.contractYears = 2 + (i % 4);          // 2-5 years
        p.recalcEconomics();
        club.addPlayer(p);
      });
      assignShirtsAndCaptain(club);
      club.pickBestXI(club.formation);
      club.tactics = Object.assign({}, G.Match.DEFAULT_TACTICS);
      clubs[cd.id] = club;
      list.push(club);
    });

    var leagueClubIds = list.filter(function (c) { return c.league === 'eng'; }).map(function (c) { return c.id; });
    var league = new G.League('eng', G.DATA.leagues.eng.name, leagueClubIds);

    this.world = { clubs: clubs, list: list, league: league };
    return this.world;
  };

  function assignShirtsAndCaptain(club) {
    // Simple shirt allocation by line, captain = highest OVR outfielder.
    var nextByLine = { GK: 1, DEF: 2, MID: 6, ATT: 9 };
    var used = {};
    club.players.slice().sort(function (a, b) { return b.overall - a.overall; }).forEach(function (p) {
      var n = nextByLine[p.line]++;
      while (used[n]) n++;
      used[n] = true; p.shirt = n;
    });
    var outfield = club.players.filter(function (p) { return p.line !== 'GK'; }).sort(function (a, b) { return b.overall - a.overall; });
    if (outfield[0]) club.captainId = outfield[0].id;
  }

  Game.club = function (id) { return this.world.clubs[id]; };
  Game.managerClub = function () { return this.world.clubs[this.managerClubId]; };
  Game.league = function () { return this.world.league; };

  // ---- New game ------------------------------------------------------------
  Game.startNewGame = function (clubId) {
    this.buildWorld();
    this.managerClubId = clubId;
    this.season = '2025-26';
    this.lastRound = null;
    this.history = { results: [] };
    this.autosave();
    return this.managerClub();
  };

  // ---- Fixtures ------------------------------------------------------------
  Game.nextFixtureForManager = function () {
    return this.world.league.nextFixtureFor(this.managerClubId);
  };

  Game.opponentInfo = function () {
    var nf = this.nextFixtureForManager();
    if (!nf) return null;
    var fx = nf.fixture;
    var isHome = fx.home === this.managerClubId;
    var oppId = isHome ? fx.away : fx.home;
    return { isHome: isHome, opponent: this.club(oppId), round: nf.round + 1, fixture: fx };
  };

  // Pick a random-ish but plausible weather for a match.
  Game.rollWeather = function () {
    var r = Math.random();
    if (r < 0.55) return 'clear';
    if (r < 0.75) return 'rain';
    if (r < 0.85) return 'cloudy';
    if (r < 0.93) return 'fog';
    if (r < 0.98) return 'night';
    return 'snow';
  };

  // ---- Play the current round ---------------------------------------------
  // userOpts: { weather } ; the manager's lineup/tactics are already on the club.
  Game.playRound = function (userOpts) {
    userOpts = userOpts || {};
    var league = this.world.league;
    if (league.isComplete()) return null;
    var roundIdx = league.currentRound;
    var fixtures = league.roundFixtures(roundIdx);
    var self = this;
    var weather = userOpts.weather || this.rollWeather();

    var userResult = null, others = [];

    fixtures.forEach(function (fx) {
      if (fx.played) return;
      var home = self.club(fx.home), away = self.club(fx.away);
      var isUser = (fx.home === self.managerClubId || fx.away === self.managerClubId);

      // AI clubs always field their best XI.
      if (fx.home !== self.managerClubId) home.pickBestXI(home.formation);
      if (fx.away !== self.managerClubId) away.pickBestXI(away.formation);

      var result = G.Match.simulate(home, away, {
        weather: isUser ? weather : self.rollWeather(),
        homeTactics: home.tactics, awayTactics: away.tactics
      });
      league.recordResult(fx, result);
      result.round = roundIdx + 1;

      if (isUser) userResult = result; else others.push(result);
    });

    // Recover everyone for next week (~7 rest days) + advance injuries/morale.
    this.world.list.forEach(function (club) {
      club.players.forEach(function (p) { p.advanceDay(7); });
    });
    // Small chance of a new injury to a manager's player who featured.
    this.maybeInjure();

    league.currentRound++;
    this.lastRound = { userResult: userResult, others: others, weather: weather };
    this.history.results.push({ round: roundIdx + 1, userResult: summarize(userResult), others: others.map(summarize) });
    this.autosave();
    return this.lastRound;
  };

  function summarize(r) {
    if (!r) return null;
    return { h: r.homeShort, a: r.awayShort, hs: r.homeScore, as: r.awayScore, hId: r.homeId, aId: r.awayId };
  }

  Game.maybeInjure = function () {
    var club = this.managerClub();
    if (!club) return;
    var xi = club.lineupPlayers();
    xi.forEach(function (p) {
      if (p.isAvailable() && Math.random() < 0.012) {
        var days = 7 + Math.floor(Math.random() * 35);
        p.injuryDays = days;
        p.injury = days > 28 ? 'Muscle tear' : (days > 14 ? 'Hamstring strain' : 'Knock');
      }
    });
  };

  // ---- Standings & stats ---------------------------------------------------
  Game.standings = function () {
    var self = this;
    return this.world.league.standings(function (id) { return self.club(id); });
  };
  Game.leaderboards = function () {
    var engClubs = this.world.list.filter(function (c) { return c.league === 'eng'; });
    return G.League.leaderboards(engClubs);
  };
  Game.managerPosition = function () {
    var rows = this.standings();
    for (var i = 0; i < rows.length; i++) if (rows[i].clubId === this.managerClubId) return i + 1;
    return null;
  };

  // ---- Save / load ---------------------------------------------------------
  Game.serialize = function () {
    var league = this.world.league;
    var players = {};
    this.world.list.forEach(function (club) {
      club.players.forEach(function (p) {
        players[p.id] = {
          c: p.clubId, o: p.overall, a: p.age, f: Math.round(p.fitness), m: Math.round(p.morale),
          fm: p.form, inj: p.injuryDays, injn: p.injury, cy: p.contractYears, s: p.stats
        };
      });
    });
    var fixturesProgress = league.fixtures.map(function (round) {
      return round.map(function (m) { return m.played ? [1, m.result.homeScore, m.result.awayScore] : [0]; });
    });
    return {
      _meta: { club: this.managerClubId, clubName: this.managerClub().name, season: this.season,
               round: league.currentRound, pos: this.managerPosition() },
      v: 1, managerClubId: this.managerClubId, season: this.season,
      currentRound: league.currentRound, table: league.table,
      fixturesProgress: fixturesProgress, players: players
    };
  };

  Game.applyState = function (s) {
    this.buildWorld();
    this.managerClubId = s.managerClubId;
    this.season = s.season || '2025-26';
    var league = this.world.league;
    league.currentRound = s.currentRound || 0;
    if (s.table) league.table = s.table;
    // Restore fixture results.
    if (s.fixturesProgress) {
      s.fixturesProgress.forEach(function (round, ri) {
        round.forEach(function (m, mi) {
          var fx = league.fixtures[ri] && league.fixtures[ri][mi];
          if (fx && m[0] === 1) { fx.played = true; fx.result = { homeScore: m[1], awayScore: m[2] }; }
        });
      });
    }
    // Restore player dynamic state.
    var self = this;
    if (s.players) {
      Object.keys(s.players).forEach(function (id) {
        var d = s.players[id];
        var club = self.world.clubs[d.c];
        var p = club && club.getPlayer(id);
        if (!p) { // search all clubs (in case of transfer)
          for (var k in self.world.clubs) { p = self.world.clubs[k].getPlayer(id); if (p) break; }
        }
        if (!p) return;
        p.overall = d.o; p.age = d.a; p.fitness = d.f; p.morale = d.m; p.form = d.fm || 0;
        p.injuryDays = d.inj || 0; p.injury = d.injn || null; p.contractYears = d.cy;
        if (d.s) p.stats = d.s;
        p.att = G.Ratings.generate(p.name, p.position, p.overall);
        p.recalcEconomics();
      });
    }
    // Re-pick lineups.
    this.world.list.forEach(function (c) { c.pickBestXI(c.formation); });
    return true;
  };

  Game.autosave = function () { if (G.Save) G.Save.save('auto', this.serialize()); };
  Game.saveToSlot = function (slot) { return G.Save.save(slot, this.serialize()); };
  Game.loadFromSlot = function (slot) {
    var data = G.Save.load(slot);
    if (!data || !data.state) return false;
    this.applyState(data.state);
    return true;
  };

  G.Game = Game;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================================
 * ui.js  —  Screens, navigation, theming, rendering
 * ----------------------------------------------------------------------------
 * Vanilla DOM rendering (no framework, classic scripts so it runs from file://).
 * Builds: Main Menu, Club Selection, and the in-club shell with Squad, Tactics,
 * Match Day, League Table and Stats views. Recolors the whole UI to the chosen
 * club via CSS variables, and reveals match highlights sequentially.
 *
 * Design system: Dark Mode (OLED) + Fira Sans/Code + club-color accent.
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;
  var Game = G.Game;

  var UI = { state: { view: 'squad' } };
  var APP;

  // ---- Color utilities -----------------------------------------------------
  var Color = {
    rgb: function (hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
      return { r: parseInt(hex.slice(0, 2), 16), g: parseInt(hex.slice(2, 4), 16), b: parseInt(hex.slice(4, 6), 16) };
    },
    lum: function (hex) {
      var c = Color.rgb(hex);
      var a = [c.r, c.g, c.b].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
    },
    mix: function (hex, withHex, t) {
      var a = Color.rgb(hex), b = Color.rgb(withHex);
      var r = Math.round(a.r + (b.r - a.r) * t), g = Math.round(a.g + (b.g - a.g) * t), bl = Math.round(a.b + (b.b - a.b) * t);
      return '#' + [r, g, bl].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
    },
    // An accent guaranteed to be visible on a near-black background.
    accentFor: function (hex) {
      var l = Color.lum(hex);
      if (l < 0.12) return Color.mix(hex, '#ffffff', 0.55);
      if (l < 0.20) return Color.mix(hex, '#ffffff', 0.30);
      return hex;
    }
  };

  UI.applyTheme = function (club) {
    var accent = Color.accentFor(club.colors.primary);
    var sec = Color.accentFor(club.colors.secondary || '#ffffff');
    var r = document.documentElement.style;
    r.setProperty('--club', accent);
    r.setProperty('--club-2', sec);
    r.setProperty('--club-soft', Color.mix(accent, '#0a0c10', 0.78));
    r.setProperty('--club-glow', Color.mix(accent, '#0a0c10', 0.62));
    r.setProperty('--club-ink', Color.lum(accent) > 0.5 ? '#0a0c10' : '#ffffff');
  };

  // ---- SVG crest + icons ---------------------------------------------------
  UI.crest = function (club, size) {
    size = size || 40;
    var p = club.colors.primary, s = club.colors.secondary || '#ffffff';
    return '<svg class="crest" width="' + size + '" height="' + size + '" viewBox="0 0 48 48" aria-hidden="true">' +
      '<path d="M24 2 L44 9 V26 C44 38 35 44 24 47 C13 44 4 38 4 26 V9 Z" fill="' + p + '" stroke="' + s + '" stroke-width="2"/>' +
      '<path d="M24 2 L44 9 V26 C44 38 35 44 24 47 C13 44 4 38 4 26 V9 Z" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>' +
      '<text x="24" y="29" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" font-weight="700" fill="' +
      (Color.lum(p) > 0.55 ? '#0a0c10' : '#ffffff') + '">' + club.short + '</text></svg>';
  };

  var ICONS = {
    squad: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    tactics: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
    match: '<circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/>',
    table: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
    stats: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
    trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
    home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
    play: '<polygon points="5 3 19 12 5 21 5 3"/>',
    whistle: '<circle cx="12" cy="12" r="9"/><path d="M12 3v4M8 12h8"/>'
  };
  UI.icon = function (name, size) {
    size = size || 18;
    return '<svg class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  };

  // ---- Small format helpers ------------------------------------------------
  function money(m) { // millions
    if (m >= 1000) return '€' + (m / 1000).toFixed(2) + 'bn';
    if (m >= 1) return '€' + (Math.round(m * 10) / 10) + 'M';
    return '€' + Math.round(m * 1000) + 'k';
  }
  function wage(k) { return '€' + (k >= 1000 ? (k / 1000).toFixed(0) + 'M' : k + 'k') + '/wk'; }
  function ovrClass(o) { return o >= 85 ? 'elite' : o >= 78 ? 'good' : o >= 70 ? 'ok' : 'low'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function flag(nat) { return '<span class="nat" title="' + nat + '">' + nat + '</span>'; }
  UI.money = money;

  // ---- Mount / events ------------------------------------------------------
  UI.boot = function () {
    APP = document.getElementById('app');
    document.addEventListener('click', UI.onClick);
    document.addEventListener('change', UI.onChange);
    UI.renderMenu();
  };

  UI.onClick = function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');
    var arg = t.getAttribute('data-arg');
    switch (action) {
      case 'new-game': UI.renderClubSelect(); break;
      case 'continue': if (Game.loadFromSlot('auto')) { UI.applyTheme(Game.managerClub()); UI.enterClub(); } break;
      case 'select-club': Game.startNewGame(arg); UI.applyTheme(Game.managerClub()); UI.enterClub(); break;
      case 'view': UI.showView(arg); break;
      case 'play-match': UI.playMatch(); break;
      case 'set-formation': Game.managerClub().pickBestXI(arg); UI.showView('tactics'); break;
      case 'open-player': UI.openPlayer(arg); break;
      case 'close-modal': UI.closeModal(); break;
      case 'skip-reveal': UI.revealAll && UI.revealAll(); break;
      case 'continue-after-match': UI.closeModal(); UI.showView('matchday'); break;
      case 'save-game': Game.saveToSlot('slot1'); UI.toast('Game saved'); break;
      case 'back-to-menu': UI.renderMenu(); break;
    }
  };
  UI.onChange = function (e) {
    var t = e.target;
    if (t.getAttribute('data-change') === 'formation') { Game.managerClub().pickBestXI(t.value); UI.showView('tactics'); }
    if (t.getAttribute('data-change') === 'tactic') {
      var club = Game.managerClub();

        '</div>' +
      '</div>', true
    );

  UI._runReveal = function (r, items) {
    var feed = document.getElementById('reveal-feed');
    var scoreEl = document.getElementById('rs-score');
    var h = 0, a = 0, i = 0;
    var timers = [];
    function showItem(ev) {
      if (ev.type === 'goal') {
        if (ev.side === 'home') h++; else a++;
        scoreEl.textContent = h + ' - ' + a;
        scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop');
      }
      var row = document.createElement('div');
      row.className = 'feed-row ' + ev.type + ' ' + ev.side;
      row.innerHTML = '<span class="feed-min">' + ev.minute + "'</span>" +
        '<span class="feed-ico">' + (ev.type === 'goal' ? '⚽' : ev.type === 'save' ? '🧤' : '✗') + '</span>' +
        '<span class="feed-text">' + esc(ev.text) + '</span>';
      feed.appendChild(row);
      feed.scrollTop = feed.scrollHeight;
    }
    function finish() {
      scoreEl.textContent = r.homeScore + ' - ' + r.awayScore;
      var s = r.stats;
      document.getElementById('reveal-stats').innerHTML =
        statRow('Possession', s.possessionHome + '%', s.possessionAway + '%') +
        statRow('Shots', s.shotsHome, s.shotsAway) +
        statRow('On target', s.sotHome, s.sotAway) +
        (r.motmHome || r.motmAway ? '<div class="motm">MOTM: ' + esc((r.homeScore >= r.awayScore ? r.motmHome : r.motmAway) || r.motmHome || r.motmAway) + '</div>' : '');
      document.getElementById('reveal-foot').style.display = 'block';
    }
    UI.revealAll = function () {
      timers.forEach(clearTimeout);
      while (i < items.length) showItem(items[i++]);
      finish();
      UI.revealAll = null;
    };
    function step() {
      if (i >= items.length) { finish(); return; }
      showItem(items[i++]);
      timers.push(setTimeout(step, 420));
    }
    if (items.length === 0) { finish(); }
    else timers.push(setTimeout(step, 350));
  };
  function statRow(label, h, a) {
    return '<div class="stat-row"><b>' + h + '</b><span>' + label + '</span><b>' + a + '</b></div>';
  }

    function board(title, arr, suffix) {
      var rows = arr.slice(0, 10).map(function (e, i) {
        return '<tr><td class="c-rank">' + (i + 1) + '</td><td>' + esc(e.name) + '</td><td class="muted">' + e.club + '</td><td class="c-pts">' + e.value + '</td></tr>';
      }).join('') || '<tr><td colspan="4" class="muted center">No data yet — play some matches.</td></tr>';
      return '<div class="stat-card"><h3>' + title + '</h3><table class="data-table mini"><tbody>' + rows + '</tbody></table></div>';
    }
    return '<div class="view-head"><h2>Statistics</h2></div>' +
      '<div class="stats-grid">' +
        board('Top Scorers', lb.scorers) + board('Top Assists', lb.assists) + board('Clean Sheets', lb.cleanSheets) +
      '</div>';
  };

  // ---- Modal + toast -------------------------------------------------------
  UI.modal = function (html, persist) {
    UI.closeModal();
    var o = document.createElement('div');
    o.className = 'modal-overlay';
    o.id = 'modal';
    o.innerHTML = '<div class="modal" role="dialog">' + html + '</div>';
    if (!persist) o.addEventListener('click', function (e) { if (e.target === o) UI.closeModal(); });
    document.body.appendChild(o);
    requestAnimationFrame(function () { o.classList.add('show'); });
  };
  UI.closeModal = function () { var m = document.getElementById('modal'); if (m) m.remove(); };
  UI.toast = function (msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 1800);
  };

  function ordinal(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  G.UI = UI;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        Gaffer.UI.boot();
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div style="padding:40px;color:#e25563;font-family:monospace;background:#07090d;min-height:100vh">Failed to start: ' + e.message + '</div>';
        console.error(e);
      }
    });
  </script>
</body>
