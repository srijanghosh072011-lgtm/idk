<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090d" />
  <title>Gaffer — Football Management</title>
  <meta name="description" content="A football management career sim. Pick a club, set your tactics, run the transfer market, and sim your way through the season." />
  <!-- SELF-CONTAINED BUILD: all CSS + JS are inlined below so this one file runs
       anywhere with no other files needed. Edit the source in css/ and js/, then
       regenerate with:  node build.js -->
  <style>
/* ============================================================================
 * Gaffer — Football Management. Stylesheet.
 * Design system: Dark Mode (OLED) · Fira Sans / Fira Code · club-color accent.
 * The --club* variables are set at runtime by ui.js from the chosen club.
 * ==========================================================================*/
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #07090d;
  --surface: #0e1218;
  --surface-2: #141a22;
  --surface-3: #1b232e;
  --line: rgba(255, 255, 255, .08);
  --line-2: rgba(255, 255, 255, .15);
  --text: #e7ecf3;
  --text-dim: #97a3b4;
  --text-mut: #5e6c7e;

  --club: #4f8ff7;
  --club-2: #ffffff;
  --club-soft: #12203a;
  --club-glow: #16243d;
  --club-ink: #ffffff;

  --elite: #f5c451;
  --good: #5dd39e;
  --ok: #c4cedd;
  --low: #8593a4;
  --win: #46c98a;
  --draw: #e3b341;
  --loss: #e25563;

  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
  --shadow-md: 0 4px 14px rgba(0, 0, 0, .35);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, .5);
  --sans: 'Fira Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Fira Code', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#app { min-height: 100vh; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.icon { display: inline-block; vertical-align: middle; flex: none; }
.crest { display: block; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4)); }
.muted { color: var(--text-mut); }
.center { text-align: center; }
.mono, .ovr, .c-pts, .rs-score, .face-v { font-family: var(--mono); }

/* ---- Buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--sans); font-size: 14px; font-weight: 600;
  padding: 10px 18px; border-radius: var(--r-sm); border: 1px solid transparent;
  cursor: pointer; transition: background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
  color: var(--text); background: var(--surface-3);
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--club); outline-offset: 2px; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--club); color: var(--club-ink); border-color: transparent; }
.btn-primary:hover { background: var(--club); filter: brightness(1.08); }
.btn-secondary { background: transparent; border-color: var(--line-2); color: var(--text); }
.btn-secondary:hover { border-color: var(--club); color: var(--club); background: transparent; }
.btn-ghost { background: transparent; color: var(--text-dim); }
.btn-ghost:hover { color: var(--text); background: var(--surface-2); }
.btn-lg { padding: 14px 26px; font-size: 16px; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn-meta { display: block; font-size: 11px; font-weight: 400; opacity: .8; margin-top: 2px; }

.pill { display: inline-flex; align-items: center; padding: 4px 12px; background: var(--surface-3);
  border: 1px solid var(--line); border-radius: 100px; font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
.lbl { font-size: 12px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 8px; }
.lbl.block { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
select {
  font-family: var(--sans); font-size: 13px; color: var(--text); background: var(--surface-3);
  border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 12px; cursor: pointer;
}
select:focus-visible { outline: 2px solid var(--club); }
.hint { font-size: 12.5px; color: var(--text-mut); line-height: 1.6; }

/* ---- Main Menu ---------------------------------------------------------- */
.menu-screen { position: relative; height: 100vh; overflow: hidden; display: grid; place-items: center; }
.menu-bg { position: absolute; inset: 0; z-index: 0; }
.menu-stadium {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 50% 110%, var(--club-glow) 0%, transparent 55%),
    radial-gradient(80% 60% at 50% 0%, #0d1622 0%, transparent 60%),
    linear-gradient(180deg, #05070a, #0a0f16 60%, #070b11);
}
.menu-stadium::after {
  content: ''; position: absolute; left: 50%; bottom: -10%; transform: translateX(-50%);
  width: 130%; height: 55%; border-radius: 50% 50% 0 0;
  background: repeating-linear-gradient(90deg, rgba(80,140,90,.10) 0 6%, rgba(60,110,70,.16) 6% 12%);
  box-shadow: 0 0 120px 40px rgba(0,0,0,.6) inset;
}
.menu-rain { position: absolute; inset: 0; opacity: .25;
  background-image: repeating-linear-gradient(105deg, transparent 0 22px, rgba(180,200,230,.20) 22px 23px);
  animation: rain 0.7s linear infinite; }
@keyframes rain { to { background-position: -60px 120px; } }
.menu-inner { position: relative; z-index: 1; text-align: center; padding: var(--sp-xl); }
.brand-mark { width: 64px; height: 64px; margin: 0 auto var(--sp-md); border-radius: 50%;
  display: grid; place-items: center; color: var(--club);
  background: var(--club-soft); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); }
.brand-title { font-family: var(--mono); font-size: 64px; font-weight: 700; letter-spacing: .12em;
  background: linear-gradient(180deg, #fff, #9fb3cc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { color: var(--text-dim); margin: 4px 0 0; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; }
.menu-actions { display: flex; flex-direction: column; gap: 12px; margin: var(--sp-xl) auto 0; max-width: 320px; }
.menu-foot { margin-top: var(--sp-xl); color: var(--text-mut); font-size: 12px; }

/* ---- Club Selection ----------------------------------------------------- */
.select-screen { max-width: 1200px; margin: 0 auto; padding: var(--sp-xl) var(--sp-lg) 64px; }
.select-head { margin-bottom: var(--sp-lg); }
.select-head h2 { font-size: 28px; margin-top: var(--sp-sm); }
.select-head p { color: var(--text-dim); margin: 4px 0 0; }
.club-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--sp-md); }
.club-card {
  text-align: left; cursor: pointer; padding: var(--sp-md); border-radius: var(--r-md);
  background: linear-gradient(160deg, var(--cg, #131a24), var(--surface)); border: 1px solid var(--line);
  color: var(--text); transition: border-color .18s ease, transform .12s ease, box-shadow .18s ease;
}
.club-card:hover { border-color: var(--ca, var(--club)); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.club-card:focus-visible { outline: 2px solid var(--ca, var(--club)); outline-offset: 2px; }
.club-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-sm); }
.club-card-rep .star { color: #33404f; font-size: 13px; }
.club-card-rep .star.on { color: var(--ca, var(--club)); }
.club-card-name { font-weight: 600; font-size: 16px; line-height: 1.2; }
.club-card-meta { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.club-card-stadium { margin-top: 6px; font-size: 11.5px; color: var(--text-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- App Shell ---------------------------------------------------------- */
.app-shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: var(--sp-md);
  display: flex; flex-direction: column; gap: var(--sp-md); position: sticky; top: 0; height: 100vh; }
.sidebar-club { display: flex; gap: 10px; align-items: center; padding-bottom: var(--sp-md); border-bottom: 1px solid var(--line); }
.sidebar-club-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
.sidebar-club-sub { font-size: 11px; color: var(--text-mut); }
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 11px 12px; border-radius: var(--r-sm); border: none; background: transparent; color: var(--text-dim);
  font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--club-soft); color: var(--club); }
.nav-item.active .icon { color: var(--club); }
.sidebar-foot { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: var(--sp-md); }

.content { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md);
  padding: 14px var(--sp-lg); border-bottom: 1px solid var(--line); background: var(--surface);
  position: sticky; top: 0; z-index: 20; }
.tb-left { display: flex; align-items: center; gap: var(--sp-md); }
.tb-season { font-family: var(--mono); font-weight: 600; color: var(--club); }
.tb-pos { font-size: 13px; color: var(--text-dim); }
.tb-right { display: flex; align-items: center; gap: var(--sp-lg); }
.tb-stat { text-align: right; font-size: 11px; color: var(--text-mut); }
.tb-stat b { display: block; font-family: var(--mono); font-size: 14px; color: var(--text); font-weight: 600; }
.tb-next { padding: 6px 14px; border-radius: var(--r-sm); background: var(--club-soft); color: var(--club);
  font-family: var(--mono); font-weight: 600; font-size: 13px; }

.view { padding: var(--sp-lg); max-width: 1200px; width: 100%; }
.view-head { display: flex; align-items: center; gap: var(--sp-md); margin-bottom: var(--sp-lg); flex-wrap: wrap; }
.view-head h2 { font-size: 22px; }
.view-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap; }

/* ---- Tables ------------------------------------------------------------- */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data-table th { text-align: left; padding: 11px 12px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-mut); border-bottom: 1px solid var(--line); font-weight: 600; background: var(--surface-2); }
.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
.data-table tbody tr:last-child td { border-bottom: none; }
.prow { cursor: pointer; transition: background .14s; }
.prow:hover { background: var(--surface-2); }
.c-num { color: var(--text-mut); font-family: var(--mono); width: 34px; }
.c-ovr, .c-pts { text-align: center; }
.c-age, .c-pot { text-align: center; color: var(--text-dim); }
.c-val, .c-wage { font-family: var(--mono); color: var(--text-dim); text-align: right; white-space: nowrap; }
.pos { display: inline-block; min-width: 38px; text-align: center; font-size: 11px; font-weight: 700;
  font-family: var(--mono); padding: 3px 6px; border-radius: 5px; }
.pos-GK { background: rgba(243,196,81,.15); color: #f3c451; }
.pos-DEF { background: rgba(93,211,158,.14); color: #5dd39e; }
.pos-MID { background: rgba(96,165,250,.14); color: #7fb1ff; }
.pos-ATT { background: rgba(226,85,99,.16); color: #ff7a86; }
.ovr { display: inline-block; min-width: 30px; text-align: center; font-weight: 700; padding: 3px 6px; border-radius: 5px; }
.ovr.elite { background: rgba(245,196,81,.16); color: var(--elite); }
.ovr.good { background: rgba(93,211,158,.14); color: var(--good); }
.ovr.ok { background: var(--surface-3); color: var(--ok); }
.ovr.low { background: var(--surface-3); color: var(--low); }
.cap { font-family: var(--mono); font-size: 9px; font-weight: 700; background: var(--club); color: var(--club-ink);
  padding: 1px 4px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }
.inj { font-family: var(--mono); font-size: 10px; color: var(--loss); background: rgba(226,85,99,.12);
  padding: 1px 5px; border-radius: 4px; margin-left: 6px; }
.nat { font-family: var(--mono); font-size: 11px; color: var(--text-mut); }
.bar { display: inline-block; width: 60px; height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; vertical-align: middle; }
.bar-fill { display: block; height: 100%; border-radius: 4px; }
.bar-fill.hi { background: var(--win); } .bar-fill.mid { background: var(--draw); } .bar-fill.lo { background: var(--loss); }

/* ---- League table specifics --------------------------------------------- */
.c-rank { width: 30px; text-align: center; color: var(--text-mut); font-family: var(--mono); }
.c-club { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.league-table .c-pts { font-weight: 700; color: var(--text); }
.league-table tr.me { background: var(--club-soft); }
.league-table tr.me .c-club { color: var(--club); font-weight: 600; }
.c-form { display: flex; gap: 3px; }
.c-form span { width: 16px; height: 16px; border-radius: 3px; font-size: 9px; font-weight: 700;
  display: inline-grid; place-items: center; font-family: var(--mono); }
.form-W { background: rgba(70,201,138,.2); color: var(--win); }
.form-D { background: rgba(227,179,65,.2); color: var(--draw); }
.form-L { background: rgba(226,85,99,.2); color: var(--loss); }
tr.zone-champ td:first-child, tr.zone-ucl td:first-child { box-shadow: inset 3px 0 0 var(--good); }
tr.zone-uel td:first-child { box-shadow: inset 3px 0 0 #60a5fa; }
tr.zone-rel td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
.legend { display: flex; gap: var(--sp-md); margin-top: var(--sp-md); flex-wrap: wrap; }
.lg { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.lg::before { content: ''; width: 10px; height: 10px; border-radius: 3px; }
.lg.champ::before, .lg.ucl::before { background: var(--good); }
.lg.uel::before { background: #60a5fa; } .lg.rel::before { background: var(--loss); }

/* ---- Player modal ------------------------------------------------------- */
.player-modal { width: min(560px, 92vw); }
.pm-head { position: relative; display: flex; align-items: center; gap: var(--sp-md); padding: var(--sp-lg);
  border-radius: var(--r-md) var(--r-md) 0 0; border-bottom: 1px solid var(--line); }
.pm-ovr { text-align: center; }
.ovr-big { font-family: var(--mono); font-size: 40px; font-weight: 700; line-height: 1; display: block; }
.pm-ovr span:last-child { font-size: 10px; color: var(--text-mut); letter-spacing: .1em; }
.pm-id h3 { font-size: 20px; }
.pm-sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
.pm-sub2 { color: var(--text-mut); font-size: 12px; margin-top: 4px; }
.modal-x { position: absolute; top: 14px; right: 14px; background: transparent; border: none; color: var(--text-mut);
  font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.modal-x:hover { background: var(--surface-3); color: var(--text); }
.pm-faces { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); }
.face { background: var(--surface); padding: 12px 4px; text-align: center; }
.face-v { font-size: 20px; font-weight: 700; display: block; }
.face-v.elite { color: var(--elite); } .face-v.good { color: var(--good); } .face-v.ok { color: var(--ok); } .face-v.low { color: var(--low); }
.face-k { font-size: 10px; color: var(--text-mut); letter-spacing: .08em; }
.pm-section { padding: var(--sp-md) var(--sp-lg); border-top: 1px solid var(--line); }
.pm-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mut); margin-bottom: 10px; }
.pm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kv { background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; }
.kv span { font-size: 11px; color: var(--text-mut); display: block; }
.kv b { font-family: var(--mono); font-size: 15px; }
.traits { display: flex; flex-wrap: wrap; gap: 8px; }
.trait { font-size: 12px; background: var(--club-soft); color: var(--club); padding: 4px 10px; border-radius: 100px; border: 1px solid var(--line-2); }

/* ---- Tactics + pitch ---------------------------------------------------- */
.tactics-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--sp-lg); align-items: start; }
.pitch-card, .md-lineup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-md); }
.pitch {
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), transparent),
    repeating-linear-gradient(180deg, #0f2417 0 10%, #103019 10% 20%);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: var(--sp-md) var(--sp-sm); display: flex; flex-direction: column; gap: var(--sp-md); min-height: 380px;
}
.pitch-row { display: flex; justify-content: center; gap: var(--sp-sm); flex-wrap: wrap; }
.r-att { margin-top: 6px; } .r-gk { margin-top: auto; margin-bottom: 6px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
  background: rgba(7,10,14,.72); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px 8px;
  color: var(--text); min-width: 64px; transition: border-color .15s, transform .12s; }
.chip:hover { border-color: var(--club); transform: translateY(-2px); }
.chip-ovr { font-family: var(--mono); font-weight: 700; font-size: 13px; }
.chip-ovr.elite { color: var(--elite); } .chip-ovr.good { color: var(--good); } .chip-ovr.ok { color: var(--ok); } .chip-ovr.low { color: var(--low); }
.chip-name { font-size: 11px; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tactic-controls { display: flex; flex-direction: column; gap: var(--sp-md); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-lg); }

/* ---- Match Day ---------------------------------------------------------- */
.md-fixture { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp-md);
  padding: var(--sp-xl) var(--sp-lg); border-radius: var(--r-md); border: 1px solid var(--line); margin-bottom: var(--sp-lg); }
.md-team { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.md-team-name { font-weight: 600; text-align: center; }
.md-team-ovr { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.md-vs { text-align: center; color: var(--text-mut); }
.md-vs-x { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--text); margin: 4px 0; }
.md-venue { font-size: 11px; }
.md-cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--sp-lg); align-items: start; }
.md-lineup h3 { font-size: 15px; margin-bottom: var(--sp-sm); }
.md-panel { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: var(--sp-lg); }
.md-readout { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
.md-readout b { margin-left: auto; font-family: var(--mono); color: var(--text); }
.md-readout .bar { width: 80px; }
.empty-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-xl); color: var(--text-dim); }

/* ---- Match reveal ------------------------------------------------------- */
.reveal { width: min(560px, 94vw); }
.reveal-head { text-align: center; padding: var(--sp-lg); border-bottom: 1px solid var(--line); position: relative;
  background: linear-gradient(135deg, var(--club-glow), transparent); border-radius: var(--r-md) var(--r-md) 0 0; }
.reveal-scoreline { display: flex; align-items: center; justify-content: center; gap: var(--sp-lg); }
.rs-team { font-weight: 700; font-size: 18px; min-width: 52px; }
.rs-score { font-size: 40px; font-weight: 700; min-width: 120px; }
.rs-score.pop { animation: pop .4s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); color: var(--club); } 100% { transform: scale(1); } }
.reveal-sub { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; }
.reveal-head .btn-sm { position: absolute; top: 14px; right: 14px; }
.reveal-feed { max-height: 46vh; overflow-y: auto; padding: var(--sp-sm) var(--sp-md); display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.feed-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm);
  background: var(--surface-2); font-size: 13px; animation: slidein .3s ease; }
@keyframes slidein { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.feed-row.goal { background: var(--club-soft); border: 1px solid var(--line-2); }

<body>
  <div id="app"></div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;color:#e7ecf3;background:#07090d">
      <h1>Gaffer</h1><p>This game needs JavaScript enabled. Please turn it on and reload.</p>
    </div>

<script>
/* ============================================================================
 * ratings.js  —  The attribute & rating engine
 * ----------------------------------------------------------------------------
 * Every player in the data files is stored compactly as:
 *     [name, position, age, nationality, overall, potential]
 *
 * This module deterministically expands that into the full set of ~30 detailed
 * attributes (pace, finishing, vision, tackling, ...) using position-based
 * "archetype" profiles. Because generation is seeded by the player's name, the
 * same player ALWAYS gets the same attributes — so we never have to store all
 * 30 numbers per player, and saves stay tiny.
 *
 * It also derives: position-weighted OVR, market value, weekly wage, and traits.
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;
  var R = {};

  // ---- Deterministic RNG ---------------------------------------------------
  // mulberry32: tiny, fast, seedable PRNG so attribute generation is repeatable.
  function hashString(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, Math.round(v))); }
  R.clamp = clamp;

  // ---- Position groups -----------------------------------------------------
  // Detailed positions collapse into archetype groups that share a profile.
  var GROUP = {
    GK: 'GK',
    RB: 'FB', LB: 'FB', RWB: 'FB', LWB: 'FB',
    CB: 'CB', RCB: 'CB', LCB: 'CB',
    CDM: 'DM',
    CM: 'CM', RCM: 'CM', LCM: 'CM',
    RM: 'WM', LM: 'WM',
    CAM: 'AM', CF: 'AM',
    RW: 'W', LW: 'W',
    ST: 'ST'
  };
  R.groupOf = function (pos) { return GROUP[pos] || 'CM'; };

  // Broad lines used by tactics / squad screens.
  R.lineOf = function (pos) {
    var g = R.groupOf(pos);
    if (g === 'GK') return 'GK';
    if (g === 'CB' || g === 'FB') return 'DEF';
    if (g === 'DM' || g === 'CM' || g === 'WM') return 'MID';
    return 'ATT'; // AM, W, ST
  };

  // The six "face" stats (FIFA-style) used for OVR + the match engine.
  var FACES = ['pac', 'sho', 'pas', 'dri', 'def', 'phy'];

  // Per-group: how each face sits relative to the player's overall, and how
  // much each face contributes to the position-weighted OVR.
  var PROFILE = {
    CB: { off: { pac: -6, sho: -28, pas: -8, dri: -12, def: 7, phy: 6 },
          w:   { pac: .10, sho: .04, pas: .12, dri: .10, def: .42, phy: .22 } },
    FB: { off: { pac: 6, sho: -14, pas: 0, dri: 1, def: 2, phy: -1 },
          w:   { pac: .20, sho: .05, pas: .18, dri: .17, def: .25, phy: .15 } },
    DM: { off: { pac: -4, sho: -10, pas: 2, dri: -2, def: 6, phy: 5 },
          w:   { pac: .09, sho: .05, pas: .22, dri: .14, def: .30, phy: .20 } },
    CM: { off: { pac: -2, sho: -3, pas: 6, dri: 3, def: 0, phy: 0 },
          w:   { pac: .08, sho: .12, pas: .28, dri: .22, def: .16, phy: .14 } },
    WM: { off: { pac: 7, sho: -2, pas: 1, dri: 6, def: -8, phy: -6 },
          w:   { pac: .22, sho: .14, pas: .20, dri: .26, def: .10, phy: .08 } },
    AM: { off: { pac: 1, sho: 3, pas: 5, dri: 6, def: -12, phy: -5 },
          w:   { pac: .14, sho: .22, pas: .24, dri: .25, def: .06, phy: .09 } },
    W:  { off: { pac: 8, sho: 1, pas: 0, dri: 7, def: -11, phy: -7 },
          w:   { pac: .22, sho: .20, pas: .18, dri: .26, def: .06, phy: .08 } },
    ST: { off: { pac: 4, sho: 7, pas: -6, dri: 2, def: -22, phy: 2 },
          w:   { pac: .18, sho: .34, pas: .10, dri: .20, def: .04, phy: .14 } }
  };

  // GK is its own world.
  var GK_W = { diving: .21, handling: .21, kicking: .11, reflexes: .21, speed: .05, positioning: .21 };

  // ---- OVR calculator (derives overall from the face stats) ----------------
  R.calculateOutfieldOVR = function (faces, group) {
    var w = (PROFILE[group] || PROFILE.CM).w;
    var sum = 0;
    for (var i = 0; i < FACES.length; i++) sum += faces[FACES[i]] * w[FACES[i]];
    return Math.round(sum);
  };
  R.calculateGkOVR = function (gk) {
    var sum = 0;
    for (var k in GK_W) sum += gk[k] * GK_W[k];
    return Math.round(sum);
  };

  // ---- Attribute generation ------------------------------------------------
  function genGK(ovr, rng) {
    var gk = {
      diving: ovr + (rng() * 6 - 3),
      handling: ovr + (rng() * 6 - 4),
      kicking: ovr + (rng() * 10 - 8),
      reflexes: ovr + (rng() * 6 - 3),
      speed: ovr - 22 + (rng() * 8),
      positioning: ovr + (rng() * 6 - 3)
    };
    // Shift so the weighted OVR lands exactly on the authored value.
    var delta = ovr - R.calculateGkOVR(gk);
    for (var k in gk) gk[k] = clamp(gk[k] + delta, 20, 99);
    return gk;
  }

  function genOutfield(ovr, group, rng) {
    var p = PROFILE[group] || PROFILE.CM;
    var faces = {};
    FACES.forEach(function (f) { faces[f] = ovr + p.off[f] + (rng() * 6 - 3); });
    // Normalise so derived OVR == authored OVR.
    var delta = ovr - R.calculateOutfieldOVR(faces, group);
    FACES.forEach(function (f) { faces[f] = clamp(faces[f] + delta, 20, 99); });

    function around(base, spread) { return clamp(base + (rng() * spread * 2 - spread), 10, 99); }
    var a = {
      faces: faces,
      // Pace
      acceleration: around(faces.pac, 4),
      sprintSpeed: around(faces.pac, 4),
      // Shooting
      finishing: around(faces.sho + 2, 5),
      shotPower: around(faces.sho, 6),
      longShots: around(faces.sho - 2, 7),
      volleys: around(faces.sho - 4, 8),
      penalties: around(faces.sho - 1, 7),
      positioning: around(faces.sho, 6),
      // Passing
      shortPass: around(faces.pas + 2, 4),
      longPass: around(faces.pas - 1, 6),
      vision: around(faces.pas, 6),
      crossing: around(faces.pas - 2, 7),
      curve: around(faces.pas - 2, 8),
      // Dribbling
      dribbling: around(faces.dri + 1, 4),
      ballControl: around(faces.dri + 1, 4),
      agility: around(faces.dri, 6),
      balance: around(faces.dri, 7),
      reactions: around(ovr, 5),
      composure: around(ovr, 6),
      // Defending
      defAwareness: around(faces.def, 5),
      standingTackle: around(faces.def, 5),
      slidingTackle: around(faces.def - 3, 7),
      interceptions: around(faces.def, 6),
      heading: around((faces.def + faces.phy) / 2, 8),
      // Physical
      strength: around(faces.phy, 6),
      stamina: around(faces.phy + 3, 6),
      jumping: around(faces.phy, 8),
      aggression: around(faces.phy - 2, 10)
    };
    return a;
  }

  // Public: expand a compact player record into full attributes (deterministic).
  R.generate = function (name, position, ovr) {
    var rng = mulberry32(hashString(name + '#' + position));
    var group = R.groupOf(position);
    if (group === 'GK') {
      return { isGK: true, group: 'GK', gk: genGK(ovr, rng) };
    }
    var att = genOutfield(ovr, group, rng);
    att.isGK = false;
    att.group = group;
    return att;
  };

  // ---- Match-engine rating shortcuts --------------------------------------
  // These aggregate the detailed attributes into the handful of numbers the
  // simulation actually cares about, by line.
  R.attackContribution = function (att, ovr) {
    if (att.isGK) return ovr * 0.1;
    var f = att.faces;
    return (f.sho * 0.45 + f.dri * 0.30 + f.pac * 0.25);
  };
  R.creativityContribution = function (att, ovr) {
    if (att.isGK) return att.gk.kicking * 0.3;
    var f = att.faces;
    return (f.pas * 0.55 + f.dri * 0.30 + f.pac * 0.15);
  };
  R.defenceContribution = function (att, ovr) {
    if (att.isGK) return ovr; // handled separately as keeper
    var f = att.faces;
    return (f.def * 0.6 + f.phy * 0.25 + f.pac * 0.15);
  };
  R.keeperRating = function (att, ovr) {
    if (!att.isGK) return Math.max(30, ovr - 25);
    var gk = att.gk;
    return (gk.reflexes * 0.3 + gk.diving * 0.3 + gk.positioning * 0.25 + gk.handling * 0.15);
  };

  // ---- Economics -----------------------------------------------------------
  // Market value (in millions of currency units). Driven by OVR (steep),
  // age (peak ~24-27), potential headroom, and contract length.
  R.marketValue = function (ovr, age, potential, contractYears) {
    // Base curve: cheap squad players, very expensive elite (steep).
    var base = Math.pow(Math.max(0, ovr - 50) / 10, 4.3) * 0.205; // millions
    // Age factor: young & prime worth more, sharp drop after 31.
    var ageF;
    if (age <= 21) ageF = 1.35;
    else if (age <= 27) ageF = 1.15;
    else if (age <= 30) ageF = 0.9;
    else if (age <= 32) ageF = 0.6;
    else if (age <= 34) ageF = 0.35;
    else ageF = 0.18;
    // Potential headroom adds value for the young.
    var potF = 1 + Math.max(0, (potential - ovr)) * (age < 24 ? 0.035 : 0.015);
    // Contract: short contracts are cheaper (leverage).
    var conF = 0.7 + Math.min(4, contractYears || 2) * 0.1;
    var val = base * ageF * potF * conF;
    // Round to a sensible figure.
    if (val >= 50) return Math.round(val);
    if (val >= 10) return Math.round(val * 2) / 2;
    if (val >= 1) return Math.round(val * 10) / 10;
    return Math.max(0.05, Math.round(val * 20) / 20);
  };

  // Weekly wage (in thousands). Rough mapping from OVR with an age premium.
  R.weeklyWage = function (ovr, age) {
    var base = Math.pow(Math.max(0, ovr - 50) / 8, 2.7) * 1.4; // thousands/week
    var ageF = (age >= 24 && age <= 31) ? 1.15 : (age < 21 ? 0.7 : 1.0);
    var w = base * ageF;
    if (w >= 100) return Math.round(w / 5) * 5;
    if (w >= 10) return Math.round(w);
    return Math.max(1, Math.round(w));
  };

  // ---- Traits --------------------------------------------------------------
  R.deriveTraits = function (att, ovr, position) {
    if (att.isGK) {
      var t = [];
      if (att.gk.reflexes >= 85) t.push('Shot Stopper');
      if (att.gk.kicking >= 80) t.push('Sweeper Keeper');
      if (ovr >= 86) t.push('Leadership');
      return t;
    }
    var f = att.faces, traits = [];
    if (att.longShots >= 87) traits.push('Long Shot Taker');
    if (f.dri >= 88) traits.push('Flair');
    if (f.pac >= 92) traits.push('Speedster');
    if (att.finishing >= 90) traits.push('Clinical Finisher');
    if (f.pas >= 88 && att.vision >= 88) traits.push('Playmaker');
    if (att.aggression >= 86 && f.def >= 82) traits.push('Aggressive');
    if (att.crossing >= 88) traits.push('Crosser');
    if (att.heading >= 86 && f.phy >= 82) traits.push('Aerial Threat');
    if (ovr >= 88) traits.unshift('Leadership'); // elite players carry the team
    return traits.slice(0, 3);
  };

  G.Ratings = R;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================================
 * player.js  —  The Player model
 * ----------------------------------------------------------------------------
 * Built from a compact record + the Ratings engine. Holds the live, mutable
 * state that changes during a career: morale, fitness, injuries, form, contract,
 * and dynamic OVR (from ageing). Static attributes come from Ratings.generate().
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;
  var R = G.Ratings;

  var _idCounter = 1;

  function Player(rec, clubId) {
    // rec = [name, position, age, nationality, overall, potential, (shirt?)]
    this.id = 'p' + (_idCounter++);
    this.name = rec[0];
    this.position = rec[1];
    this.age = rec[2];
    this.nationality = rec[3];
    this.overall = rec[4];
    this.potential = Math.max(rec[5] || rec[4], rec[4]);
    this.shirt = rec[6] || null;
    this.clubId = clubId || null;

    this.line = R.lineOf(this.position);           // GK / DEF / MID / ATT
    this.group = R.groupOf(this.position);          // archetype group
    this.att = R.generate(this.name, this.position, this.overall);
    this.traits = R.deriveTraits(this.att, this.overall, this.position);

    // Live career state.
    this.morale = 70;          // 0-100
    this.fitness = 100;        // 0-100 (match sharpness / freshness)
    this.form = 0;             // -5..+5 recent-form modifier
    this.injuryDays = 0;       // days until fit
    this.injury = null;        // description string when injured

    // Contract / economics.
    this.contractYears = rec[7] != null ? rec[7] : 3; // years remaining (default 3)
    this.wage = R.weeklyWage(this.overall, this.age);     // thousands/week
    this.value = R.marketValue(this.overall, this.age, this.potential, this.contractYears); // millions

    // Season stats (reset each season).
    this.stats = freshStats();
    this.seasonHistory = [];
  }

  function freshStats() {
    return {
      apps: 0, goals: 0, assists: 0, cleanSheets: 0,
      ratingSum: 0, ratingCount: 0,
      shots: 0, tackles: 0, passesAttempted: 0, passesCompleted: 0,
      yellow: 0, red: 0, motm: 0
    };
  }

  Player.prototype.recalcEconomics = function () {
    this.wage = R.weeklyWage(this.overall, this.age);
    this.value = R.marketValue(this.overall, this.age, this.potential, this.contractYears);
  };

  Player.prototype.avgRating = function () {
    return this.stats.ratingCount ? (this.stats.ratingSum / this.stats.ratingCount) : 0;
  };
  Player.prototype.passAccuracy = function () {
    return this.stats.passesAttempted
      ? Math.round(100 * this.stats.passesCompleted / this.stats.passesAttempted) : 0;
  };

  Player.prototype.isAvailable = function () {
    return this.injuryDays <= 0;
  };

  // ---- Match-engine contributions -----------------------------------------
  // Scaled by current fitness so tired players perform worse.
  Player.prototype.attack = function () {
    return R.attackContribution(this.att, this.overall) * this._fitScale();
  };
  Player.prototype.creativity = function () {
    return R.creativityContribution(this.att, this.overall) * this._fitScale();
  };
  Player.prototype.defence = function () {
    return R.defenceContribution(this.att, this.overall) * this._fitScale();
  };
  Player.prototype.keeper = function () {
    return R.keeperRating(this.att, this.overall) * this._fitScale();
  };
  Player.prototype._fitScale = function () {
    return 0.82 + 0.18 * (this.fitness / 100) + this.form * 0.01;
  };

  // ---- Ageing / development (called once per in-game year) -----------------
  // 16-26: grows toward potential. 27-31: plateau. 32+: decline.
  Player.prototype.ageOneYear = function (devModifier) {
    this.age += 1;
    devModifier = devModifier || 1; // youth-coach / training quality multiplier
    var delta = 0;
    if (this.age <= 26) {
      var room = this.potential - this.overall;
      if (room > 0) delta = Math.max(0, Math.round((0.18 * room + 0.4) * devModifier));
    } else if (this.age <= 31) {
      delta = (Math.random() < 0.25) ? 1 : 0; // slight late bloom chance
    } else if (this.age <= 33) {
      delta = -1;
    } else if (this.age <= 35) {
      delta = -2;
    } else {
      delta = -3;
    }
    this.overall = R.clamp(this.overall + delta, 30, 99);
    // Regenerate attributes around the new overall (keeps shape via the seed).
    this.att = R.generate(this.name, this.position, this.overall);
    if (this.contractYears > 0) this.contractYears -= 0; // contract handled by calendar
    this.recalcEconomics();
    return delta;
  };

  // Should this player retire? (used by the calendar system later)
  Player.prototype.wantsToRetire = function () {
    if (this.age >= 40) return true;
    if (this.age >= 36 && this.overall < 74) return true;
    if (this.age >= 38) return Math.random() < 0.6;
    return false;
  };

  Player.prototype.resetSeasonStats = function () {
    if (this.stats.apps > 0) this.seasonHistory.push(this.stats);
    this.stats = freshStats();
  };

  // Advance recovery over a number of rest days (a league round ~ 7 days).
  // injuryRecoveryRate >1 = better physio/fitness coach (set by staff later).
  Player.prototype.advanceDay = function (days, injuryRecoveryRate) {
    days = days || 1;
    if (this.injuryDays > 0) {
      this.injuryDays -= days * (injuryRecoveryRate || 1);
      if (this.injuryDays <= 0) { this.injuryDays = 0; this.injury = null; this.fitness = Math.max(this.fitness, 75); }
    } else if (this.fitness < 100) {
      this.fitness = Math.min(100, this.fitness + 4 * days);
    }
    // Morale drifts toward neutral-positive over time.
    if (this.morale < 65) this.morale = Math.min(100, this.morale + Math.min(3, days));
  };

  G.Player = Player;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================================
 * club.js  —  The Club model
 * ----------------------------------------------------------------------------
 * Holds a squad of Player objects, club identity (colors/stadium used for UI
 * theming), finances, and the logic to auto-pick a best XI and compute the
 * attack / midfield / defence strengths the match engine consumes.
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;

  // Formations: each maps to the set of "lines" we need to fill.
  // We keep it simple at the engine level (GK/DEF/MID/ATT counts); the tactics
  // screen will expose the named shapes.
  var FORMATIONS = {
    '4-3-3':   { DEF: 4, MID: 3, ATT: 3 },
    '4-4-2':   { DEF: 4, MID: 4, ATT: 2 },
    '4-2-3-1': { DEF: 4, MID: 5, ATT: 1 },
    '3-5-2':   { DEF: 3, MID: 5, ATT: 2 },
    '3-4-3':   { DEF: 3, MID: 4, ATT: 3 },
    '5-3-2':   { DEF: 5, MID: 3, ATT: 2 },
    '4-1-4-1': { DEF: 4, MID: 5, ATT: 1 }
  };
  G.FORMATIONS = FORMATIONS;

  function Club(data) {
    this.id = data.id;
    this.name = data.name;
    this.short = data.short;          // 3-letter code
    this.league = data.league;        // league id
    this.playable = data.playable !== false;
    this.colors = data.colors || { primary: '#1E40AF', secondary: '#FFFFFF' };
    this.stadium = data.stadium || (this.name + ' Stadium');
    this.capacity = data.capacity || 30000;
    this.reputation = data.reputation || 60; // 0-100, drives finances & AI ambition

    this.players = [];                // Player objects
    this.formation = '4-3-3';
    this.lineup = [];                 // array of 11 player ids (set on match day)

    // Finances (millions, except wages which sum thousands/week).
    this.transferBudget = data.transferBudget != null ? data.transferBudget : estimateBudget(this.reputation);
    this.wageBudget = data.wageBudget != null ? data.wageBudget : Math.round(this.transferBudget * 0.6 + 30); // k/week
    this.balance = 0;

    this.captainId = null;
  }

  function estimateBudget(rep) {
    // Rough mapping of reputation to a summer transfer kitty (millions).
    return Math.max(10, Math.round((rep - 58) * 5.5));
  }

  Club.prototype.addPlayer = function (player) {
    player.clubId = this.id;
    this.players.push(player);
  };

  Club.prototype.removePlayer = function (playerId) {
    var idx = this.players.findIndex(function (p) { return p.id === playerId; });
    if (idx >= 0) return this.players.splice(idx, 1)[0];
    return null;
  };

  Club.prototype.getPlayer = function (playerId) {
    return this.players.find(function (p) { return p.id === playerId; }) || null;
  };

  Club.prototype.wageBillWeekly = function () {
    return this.players.reduce(function (s, p) { return s + p.wage; }, 0); // thousands/week
  };

  Club.prototype.squadOVR = function () {
    if (!this.players.length) return 0;
    var top = this.players.slice().sort(byOVR).slice(0, 16);
    return Math.round(top.reduce(function (s, p) { return s + p.overall; }, 0) / top.length);
  };

  function byOVR(a, b) { return b.overall - a.overall; }

  // Pick the strongest available XI for the current formation.
  Club.prototype.pickBestXI = function (formation) {
    formation = formation || this.formation;
    var need = FORMATIONS[formation] || FORMATIONS['4-3-3'];
    var avail = this.players.filter(function (p) { return p.isAvailable(); });

    var byLine = { GK: [], DEF: [], MID: [], ATT: [] };
    avail.forEach(function (p) { byLine[p.line].push(p); });
    for (var k in byLine) byLine[k].sort(byOVR);

    var xi = [];
    // Goalkeeper.
    if (byLine.GK[0]) xi.push(byLine.GK[0]);
    // Outfield lines.
    ['DEF', 'MID', 'ATT'].forEach(function (line) {
      for (var i = 0; i < need[line] && byLine[line][i]; i++) xi.push(byLine[line][i]);
    });
    // Fill any shortfall (e.g., injuries) with best remaining outfielders.
    if (xi.length < 11) {
      var used = {};
      xi.forEach(function (p) { used[p.id] = true; });
      var rest = avail.filter(function (p) { return !used[p.id] && p.line !== 'GK'; }).sort(byOVR);
      for (var j = 0; xi.length < 11 && rest[j]; j++) xi.push(rest[j]);
    }
    this.lineup = xi.slice(0, 11).map(function (p) { return p.id; });
    this.formation = formation;
    return this.lineup;

  Club.prototype.lineupPlayers = function () {
    var self = this;
    return (this.lineup || []).map(function (id) { return self.getPlayer(id); }).filter(Boolean);
  };

  // Aggregates the selected XI into attack / midfield / defence / keeper ratings.
  Club.prototype.strengths = function () {
    var xi = this.lineupPlayers();
    if (xi.length < 11) { this.pickBestXI(); xi = this.lineupPlayers(); }

    var gk = xi.find(function (p) { return p.line === 'GK'; });
    var def = xi.filter(function (p) { return p.line === 'DEF'; });
    var mid = xi.filter(function (p) { return p.line === 'MID'; });
    var att = xi.filter(function (p) { return p.line === 'ATT'; });

    function avg(arr, fn) {
      if (!arr.length) return 50;
      return arr.reduce(function (s, p) { return s + fn(p); }, 0) / arr.length;
    }

    // Each line blends its own duty with help from neighbouring lines.
    var attackR = 0.6 * avg(att, function (p) { return p.attack(); })
                + 0.3 * avg(mid, function (p) { return p.attack(); })
                + 0.1 * avg(def, function (p) { return p.attack(); });

    var midfieldR = 0.55 * avg(mid, function (p) { return p.creativity(); })
                  + 0.25 * avg(att, function (p) { return p.creativity(); })
                  + 0.20 * avg(def, function (p) { return p.creativity(); });

    var defenceR = 0.6 * avg(def, function (p) { return p.defence(); })
                 + 0.3 * avg(mid, function (p) { return p.defence(); })
                 + 0.1 * (gk ? gk.overall : 60);

    return {
      attack: attackR,
      midfield: midfieldR,
      defence: defenceR,
      keeper: gk ? gk.keeper() : 55,
      xi: xi
    };
  };

  // Average fitness of the XI — feeds late-game fatigue effects.
  Club.prototype.lineupFitness = function () {
    var xi = this.lineupPlayers();
    if (!xi.length) return 100;
    return xi.reduce(function (s, p) { return s + p.fitness; }, 0) / xi.length;
  };

  G.Club = Club;

/* ============================================================================
 * match.js  —  The match simulation engine
 * ----------------------------------------------------------------------------
 * Simulates a 90'(+stoppage) match minute by minute. Each active minute a team
 * may create a chance (weighted by attack vs the opponent's defence, tactics,
 * home advantage and fatigue); chances may become shots, shots may become goals.
 * Produces a final score, a timeline of highlight events, team stats, and
 * per-player match ratings.
 *
 * Tuning constants live at the top so match feel is easy to adjust.
 * ==========================================================================*/
(function (root) {
  root.Gaffer = root.Gaffer || {};
  var G = root.Gaffer;

  var C = {
    BASE_CHANCE: 0.160,   // per active-minute probability of a dangerous chance
    EDGE_K: 0.0042,       // how much an attack-vs-defence edge swings chance rate
    CONVERT_BASE: 0.290,  // baseline probability a chance becomes a goal
    ON_TARGET_BASE: 0.50, // baseline probability a chance is on target
    HOME_ATT: 1.1, HOME_DEF: 1.0, HOME_POSS: 0.025,
    STOPPAGE_MAX: 5
  };

  var DEFAULT_TACTICS = {
    mentality: 'balanced', // attacking | balanced | defensive
    tempo: 'normal',       // slow | normal | high
    pressing: 'normal'     // low | normal | high
  };

  function mentalityMod(t) {
    switch (t.mentality) {
      case 'attacking': return { att: 4, def: -4, chance: 0.02 };
      case 'defensive': return { att: -4, def: 5, chance: -0.03 };
      default: return { att: 0, def: 0, chance: 0 };
    }
  }
  function tempoMod(t) {
    switch (t.tempo) {
      case 'high': return { chance: 0.02, drain: 1.35 };
      case 'slow': return { chance: -0.015, drain: 0.8 };
      default: return { chance: 0, drain: 1.0 };
    }
  }

  function rnd() { return Math.random(); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Weighted random pick of a player for a given role from the XI.
  function pickWeighted(xi, weightFn) {
    var total = 0, weights = [];
    for (var i = 0; i < xi.length; i++) { var w = Math.max(0.01, weightFn(xi[i])); weights.push(w); total += w; }
    var r = rnd() * total;
    for (var j = 0; j < xi.length; j++) { r -= weights[j]; if (r <= 0) return xi[j]; }
    return xi[xi.length - 1];
  }

  function goalScorerWeight(p) {
    // Strikers/attackers score most; midfielders some; defenders rarely.
    var lineBoost = p.line === 'ATT' ? 3.0 : (p.line === 'MID' ? 1.0 : (p.line === 'DEF' ? 0.25 : 0.02));
    return lineBoost * (p.att.isGK ? 0.01 : (p.att.finishing || 50) / 50);
  }
  function assistWeight(p) {
    var lineBoost = p.line === 'MID' ? 2.4 : (p.line === 'ATT' ? 2.0 : (p.line === 'DEF' ? 0.5 : 0.02));
    return lineBoost * (p.att.isGK ? 0.01 : ((p.att.faces ? p.att.faces.pas : 50)) / 50);
  }

  function simulateMatch(home, away, opts) {
    opts = opts || {};
    var ht = Object.assign({}, DEFAULT_TACTICS, opts.homeTactics || home.tactics || {});
    var at = Object.assign({}, DEFAULT_TACTICS, opts.awayTactics || away.tactics || {});
    var weather = opts.weather || 'clear';

    var hs = home.strengths();
    var as_ = away.strengths();
    var hm = mentalityMod(ht), am = mentalityMod(at);
    var htm = tempoMod(ht), atm = tempoMod(at);

    // Effective strengths (apply home advantage, mentality, weather).
    var weatherPenalty = (weather === 'rain' || weather === 'snow') ? 3 : (weather === 'fog' ? 2 : 0);
    var hAtt = hs.attack + C.HOME_ATT + hm.att - weatherPenalty * 0.5;
    var hDef = hs.defence + C.HOME_DEF + hm.def;
    var aAtt = as_.attack + am.att - weatherPenalty * 0.5;
    var aDef = as_.defence + am.def;

    // Possession share from midfield battle + home tilt + tempo/pressing.
    var hMid = hs.midfield + (ht.pressing === 'high' ? 3 : ht.pressing === 'low' ? -2 : 0);
    var aMid = as_.midfield + (at.pressing === 'high' ? 3 : at.pressing === 'low' ? -2 : 0);
    var pHome = clamp(hMid / (hMid + aMid) + C.HOME_POSS, 0.2, 0.8);

    var state = newTeamState(home), away_s = newTeamState(away);
    var events = [];
    var hFitStart = home.lineupFitness(), aFitStart = away.lineupFitness();

    var totalMinutes = 90;
    for (var minute = 1; minute <= totalMinutes; minute++) {
      // Late-game fatigue: tired teams create/defend slightly worse.
      var fatPhase = minute > 60 ? (minute - 60) / 30 : 0;
      var hFat = 1 - fatPhase * (1 - hFitStart / 100) * 0.25 * htm.drain;
      var aFat = 1 - fatPhase * (1 - aFitStart / 100) * 0.25 * atm.drain;

      var homeActive = rnd() < pHome;
      if (homeActive) {
        tryChance(minute, true, home, away, hAtt * hFat, aDef, hs.attack, as_.keeper, hm.chance + htm.chance, state, away_s, events);
      } else {
        tryChance(minute, false, away, home, aAtt * aFat, hDef, as_.attack, hs.keeper, am.chance + atm.chance, away_s, state, events);
      }
    }

    // Stoppage time.
    var stoppage = 1 + Math.floor(rnd() * C.STOPPAGE_MAX);
    for (var s = 1; s <= stoppage; s++) {
      var mm = 90 + s;
      if (rnd() < pHome) tryChance(mm, true, home, away, hAtt, aDef, hs.attack, as_.keeper, hm.chance, state, away_s, events, true);
      else tryChance(mm, false, away, home, aAtt, hDef, as_.attack, hs.keeper, am.chance, away_s, state, events, true);
    }

    // Possession percentage (with a little noise).
    var poss = Math.round(clamp(pHome * 100 + (rnd() * 6 - 3), 25, 75));

    events.sort(function (a, b) { return a.minute - b.minute; });

    var result = {
      homeId: home.id, awayId: away.id,
      homeName: home.name, awayName: away.name,
      homeShort: home.short, awayShort: away.short,
      homeScore: state.goals, awayScore: away_s.goals,
      events: events,
      stats: {
        possessionHome: poss, possessionAway: 100 - poss,
        shotsHome: state.shots, shotsAway: away_s.shots,
        sotHome: state.sot, sotAway: away_s.sot,
        cornersHome: Math.round(state.shots * 0.4 + rnd() * 3),
        cornersAway: Math.round(away_s.shots * 0.4 + rnd() * 3)
      },
      scorersHome: state.scorers,
      scorersAway: away_s.scorers,
      weather: weather
    };

    applyMatchRatingsAndStats(home, away, state, away_s, result);
    return result;
  }

  function newTeamState(club) {
    return { goals: 0, shots: 0, sot: 0, scorers: [], xi: club.lineupPlayers(), ratings: {} };
  }

  function tryChance(minute, isHome, atkClub, defClub, atkStrength, defStrength, rawAttack, keeperRating, chanceMod, atkState, defState, events, isStoppage) {
    var edge = atkStrength - defStrength;
    var pChance = clamp(C.BASE_CHANCE + edge * C.EDGE_K + chanceMod, 0.03, 0.32);
    if (rnd() >= pChance) return;

    atkState.shots++;
    var shooter = pickWeighted(atkState.xi.filter(notGK), goalScorerWeight);

    // Shot quality from shooter finishing vs keeper + defence.
    var finishing = shooter.att.isGK ? 40 : (shooter.att.finishing || 55);
    var q = clamp(0.5 + (finishing - keeperRating) / 90 + (rnd() * 0.3 - 0.15), 0.05, 0.95);
    var onTarget = rnd() < (C.ON_TARGET_BASE + q * 0.25);

    if (!onTarget) {
      if (rnd() < 0.35) events.push(evt(minute, isHome, 'miss', shooter, null, atkClub,
        choose(['drags it wide', 'blazes over the bar', 'sees the effort deflected behind', 'curls just past the post'])));
      return;
    }
    atkState.sot++;

    var pGoal = clamp(C.CONVERT_BASE * (finishing / (keeperRating * 0.55 + defStrength * 0.45)) , 0.04, 0.7);
    if (rnd() < pGoal) {
      atkState.goals++;
      var assister = null;
      if (rnd() < 0.72) {
        var candidates = atkState.xi.filter(function (p) { return p.id !== shooter.id && notGK(p); });
        assister = pickWeighted(candidates, assistWeight);
      }
      atkState.scorers.push({ id: shooter.id, name: shooter.name, minute: minute, assist: assister ? assister.name : null });
      atkState.ratings[shooter.id] = (atkState.ratings[shooter.id] || 0) + 1.1;
      if (assister) atkState.ratings[assister.id] = (atkState.ratings[assister.id] || 0) + 0.6;
      events.push(evt(minute, isHome, 'goal', shooter, assister, atkClub,
        choose(['finds the bottom corner', 'smashes it home', 'slots it past the keeper', 'heads it in', 'fires into the roof of the net'])));
    } else {
      // Saved.
      var keeper = defState.xi.find(function (p) { return p.line === 'GK'; });
      if (keeper) defState.ratings[keeper.id] = (defState.ratings[keeper.id] || 0) + 0.25;
      if (rnd() < 0.4) events.push(evt(minute, isHome, 'save', shooter, null, atkClub,
        choose(['but the keeper gets down well to save', 'denied by a fine save', 'the keeper tips it over'])));
    }
  }

  function notGK(p) { return p.line !== 'GK'; }
  function choose(arr) { return arr[Math.floor(rnd() * arr.length)]; }

  function evt(minute, isHome, type, player, assister, club, phrase) {
    var text;
    if (type === 'goal') {
      text = "GOAL! " + club.short + " — " + player.name + " " + phrase +
             (assister ? " (assist: " + assister.name + ")" : "") + ".";
    } else if (type === 'miss') {
      text = "Chance for " + club.short + "! " + player.name + " " + phrase + ".";
    } else if (type === 'save') {
      text = club.short + " threaten — " + player.name + ", " + phrase + ".";
    } else {
      text = player.name + " — " + phrase + ".";
    }
    return {
      minute: minute, type: type, side: isHome ? 'home' : 'away',
      playerId: player.id, playerName: player.name,
      assistName: assister ? assister.name : null, text: text
    };
  }

  // ---- Post-match: player ratings, fitness drain, stat accrual ------------
  function applyMatchRatingsAndStats(home, away, hState, aState, result) {
    process(home, hState, aState.goals, hState.goals, result, true);
    process(away, aState, hState.goals, aState.goals, result, false);

    function process(club, st, concededByMe, scoredByMe, res, isHome) {
      var xi = st.xi;
      var teamResultMod = scoredByMe > concededByMe ? 0.4 : (scoredByMe < concededByMe ? -0.4 : 0);
      var best = null, bestR = -1;
      xi.forEach(function (p) {
        var base = 6.3 + (rnd() * 0.8 - 0.4) + teamResultMod;
        base += (st.ratings[p.id] || 0);
        if (p.line === 'GK') {
          base += (concededByMe === 0 ? 0.6 : -0.15 * concededByMe);
        } else if (p.line === 'DEF') {
          base += (concededByMe === 0 ? 0.35 : -0.12 * concededByMe);
        }
        var rating = clamp(base, 4.0, 10.0);
        // Accrue season stats.
        p.stats.apps++;
        p.stats.ratingSum += rating; p.stats.ratingCount++;
        var goalsThis = st.scorers.filter(function (s) { return s.id === p.id; }).length;
        var assistsThis = st.scorers.filter(function (s) { return s.assist === p.name; }).length;
        p.stats.goals += goalsThis;
        p.stats.assists += assistsThis;
        if (p.line === 'GK' && concededByMe === 0) p.stats.cleanSheets++;
        if (p.line === 'DEF' && concededByMe === 0) p.stats.cleanSheets++;
        // Plausible secondary stats.
        var passes = Math.round(20 + (p.att.isGK ? 10 : (p.att.faces ? p.att.faces.pas : 50)) * 0.6 + rnd() * 15);
        var acc = clamp((p.att.isGK ? 0.7 : ((p.att.faces ? p.att.faces.pas : 50) / 100) + 0.2) + (rnd() * 0.1 - 0.05), 0.5, 0.97);
        p.stats.passesAttempted += passes;
        p.stats.passesCompleted += Math.round(passes * acc);
        p.stats.shots += goalsThis + (st.shots > 0 && p.line === 'ATT' && rnd() < 0.5 ? 1 : 0);
        if (p.line !== 'ATT') p.stats.tackles += Math.round(rnd() * 4);

        // Fitness drain for playing 90'.
        p.fitness = clamp(p.fitness - (16 + rnd() * 10), 20, 100);
        // Small form/morale nudge.
        if (rating >= 7.5) { p.form = Math.min(5, p.form + 1); p.morale = Math.min(100, p.morale + 2); }
        else if (rating < 6.0) { p.form = Math.max(-5, p.form - 1); }

        res['rating_' + p.id] = Math.round(rating * 10) / 10;
        if (rating > bestR) { bestR = rating; best = p; }
      });
      if (best) { best.stats.motm++; if (isHome) res.motmHome = best.name; else res.motmAway = best.name; }
    }
  }

  G.Match = { simulate: simulateMatch, CONSTANTS: C, DEFAULT_TACTICS: DEFAULT_TACTICS };
