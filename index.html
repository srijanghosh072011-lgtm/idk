<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TacticsPro - Soccer Tactical Board</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-field:#2d8a4e;
  --green-dark:#1e6b3a;
  --team-a:#3b82f6;
  --team-b:#ef4444;
  --bg:#0f1923;
  --surface:#1a2535;
  --surface2:#232f42;
  --border:#2e3e56;
  --text:#e8edf4;
  --text-muted:#7a8faa;
  --accent:#22c55e;
  --accent2:#0ea5e9;
  --font-head:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
  --bottom-bar-h:60px;
  --topbar-h:48px;
  --token-r:18px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body)}
/* ─── App shell ─────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:8px;padding:0 12px;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:50}
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#left-panel{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
#board-area{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;position:relative}
#right-panel{width:220px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
/* ─── Topbar ─────────────────────────── */
.logo{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--accent);letter-spacing:1px;white-space:nowrap;margin-right:4px}
.topbar-sep{width:1px;height:28px;background:var(--border);flex-shrink:0}
.topbar-group{display:flex;gap:5px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:background 160ms,border-color 160ms;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--border)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.btn.danger{border-color:#7f1d1d}.btn.danger:hover{background:#7f1d1d;border-color:#ef4444}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{flex-shrink:0}.btn-icon{padding:6px 8px}
/* ─── Draw toolbar (desktop) ─────────── */
#draw-toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.stroke-btn{min-width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all 160ms;color:var(--text);-webkit-tap-highlight-color:transparent}
.stroke-btn:hover,.stroke-btn.active{border-color:var(--accent);background:var(--accent);color:#000}
#draw-color{width:28px;height:28px;padding:2px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer}
/* ─── Panels ─────────────────────────── */
.panel-section{padding:11px 13px;border-bottom:1px solid var(--border)}
.panel-title{font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px}
.formation-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.formation-btn{padding:7px 4px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font-head);font-size:14px;font-weight:600;cursor:pointer;transition:all 160ms;text-align:center;-webkit-tap-highlight-color:transparent}
.formation-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.formation-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.color-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.color-swatch{width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform 160ms;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.color-swatch.active{border-color:#fff;transform:scale(1.18)}
.tool-list{display:flex;flex-direction:column;gap:3px}
.tool-btn{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text);font-family:var(--font-body);font-size:13px;cursor:pointer;transition:all 160ms;width:100%;text-align:left;-webkit-tap-highlight-color:transparent}
.tool-btn:hover{background:var(--surface2);border-color:var(--border)}
.tool-btn.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.tool-icon{width:18px;height:18px;flex-shrink:0}
.count-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.count-label{font-size:12px;color:var(--text-muted);flex:1}
.count-ctrl{display:flex;align-items:center;gap:4px}
.count-ctrl button{min-width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 160ms;-webkit-tap-highlight-color:transparent}
.count-ctrl button:hover{background:var(--border)}
.count-ctrl span{width:22px;text-align:center;font-size:13px;font-weight:600}
/* ─── Field ──────────────────────────── */
#field-wrapper{position:relative;flex-shrink:0}
#field-svg{display:block;border-radius:4px;box-shadow:0 6px 32px rgba(0,0,0,.7)}
#draw-canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:20}
#draw-canvas.drawing{pointer-events:all;cursor:crosshair;touch-action:none}
/* ─── Tokens ─────────────────────────── */
.player-token{position:absolute;width:calc(var(--token-r)*2);height:calc(var(--token-r)*2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:14px;font-weight:700;cursor:grab;user-select:none;border:2.5px solid rgba(255,255,255,.5);box-shadow:0 2px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);transition:box-shadow 160ms,transform 160ms;z-index:10;touch-action:none;-webkit-tap-highlight-color:transparent}
.player-token:hover{box-shadow:0 4px 16px rgba(0,0,0,.6);transform:scale(1.1)}
.player-token.dragging{cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.7);transform:scale(1.2);z-index:100}
.player-token .name-tag{position:absolute;top:calc(var(--token-r)*2 + 2px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:600;font-family:var(--font-body);background:rgba(0,0,0,.75);padding:1px 5px;border-radius:3px;pointer-events:none;max-width:68px;overflow:hidden;text-overflow:ellipsis}
.player-token.team-a{background:radial-gradient(circle at 35% 35%,var(--team-a),#1d4ed8)}
.player-token.team-b{background:radial-gradient(circle at 35% 35%,var(--team-b),#991b1b)}
.player-token.gk{background:radial-gradient(circle at 35% 35%,#f59e0b,#b45309)}
.ball-token{position:absolute;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f5f5f5,#9ca3af);border:2px solid rgba(0,0,0,.3);box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:grab;z-index:11;touch-action:none;transition:transform 160ms,box-shadow 160ms;-webkit-tap-highlight-color:transparent}
.ball-token:hover{transform:scale(1.15)}
.ball-token.dragging{cursor:grabbing;transform:scale(1.2);z-index:100}
/* ─── Minimap ─────────────────────────── */
#minimap-section{padding:11px 13px}
#minimap{width:100%;aspect-ratio:105/68;background:var(--green-dark);border-radius:4px;border:1px solid var(--border);position:relative;overflow:hidden}
#minimap-players{position:absolute;inset:0}
/* ─── Name editor ────────────────────── */
#name-editor{display:none;position:fixed;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:160px}
#name-editor input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:7px 10px;font-size:15px;width:100%;outline:none}
#name-editor input:focus{border-color:var(--accent2)}
#name-editor .ne-btns{display:flex;gap:6px;margin-top:8px}
/* ─── Mobile bottom bar ──────────────── */
#mobile-bar{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottom-bar-h);background:var(--surface);border-top:1px solid var(--border);z-index:100;align-items:center;justify-content:space-around;padding:0 4px}
.mb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:44px;height:52px;border-radius:8px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;transition:all 160ms;-webkit-tap-highlight-color:transparent;font-size:9px;font-family:var(--font-body);font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:0 4px}
.mb-btn svg{flex-shrink:0}
.mb-btn:active{background:var(--surface2)}
.mb-btn.active{color:var(--accent2)}
.mb-btn.active svg{stroke:var(--accent2)}
.mb-btn.accent-btn{color:var(--accent)}
.mb-btn.accent-btn svg{stroke:var(--accent)}
/* ─── Bottom sheet ───────────────────── */
#sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;opacity:0;transition:opacity 220ms}
#sheet-backdrop.open{opacity:1}
#bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:18px 18px 0 0;z-index:160;transform:translateY(100%);transition:transform 280ms cubic-bezier(.32,1,.4,1);max-height:80dvh;display:flex;flex-direction:column}
#bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 6px;flex-shrink:0}
.sheet-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-tab{flex:1;padding:10px 4px;background:transparent;border:none;color:var(--text-muted);font-family:var(--font-head);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:all 160ms;-webkit-tap-highlight-color:transparent}
.sheet-tab.active{color:var(--accent2);box-shadow:inset 0 -2px 0 var(--accent2)}
.sheet-content{overflow-y:auto;flex:1;padding:14px}
.sheet-content::-webkit-scrollbar{width:3px}
.sheet-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sheet-section{margin-bottom:18px}
.sheet-title{font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.sheet-formation-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.sheet-formation-btn{padding:10px 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font-head);font-size:15px;font-weight:700;cursor:pointer;transition:all 160ms;text-align:center;-webkit-tap-highlight-color:transparent}
.sheet-formation-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.sheet-colors{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sheet-swatch{width:36px;height:36px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 160ms}
.sheet-swatch.active{border-color:#fff;transform:scale(1.15)}
.sheet-count-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-count-label{flex:1;font-size:14px;color:var(--text-muted)}
.sheet-count-ctrl{display:flex;align-items:center;gap:6px}
.sheet-count-ctrl button{min-width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.sheet-count-ctrl span{width:24px;text-align:center;font-size:15px;font-weight:700}
.sheet-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-action-btn{display:flex;align-items:center;gap:8px;padding:13px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:all 160ms;-webkit-tap-highlight-color:transparent}
.sheet-action-btn:active{background:var(--border)}
.sheet-action-btn.danger{border-color:#7f1d1d;color:#f87171}
.sheet-action-btn.danger:active{background:#7f1d1d}
.sheet-draw-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sheet-stroke-btn{min-width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sheet-stroke-btn.active{background:var(--accent);border-color:var(--accent);color:#000}
#sheet-draw-color{width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;padding:4px}
/* ─── Scrollbars ─────────────────────── */
#left-panel::-webkit-scrollbar,#right-panel::-webkit-scrollbar{width:3px}
#left-panel::-webkit-scrollbar-thumb,#right-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* ─── Responsive ─────────────────────── */
@media(max-width:960px){#left-panel,#right-panel{width:185px}.formation-grid{grid-template-columns:1fr}}
@media(max-width:680px){
  :root{--token-r:22px}
  #left-panel,#right-panel{display:none}
  #draw-toolbar,#topbar .topbar-sep:not(:first-of-type),.topbar-group:not(#mobile-topbar-group){display:none}
  #mobile-topbar-group{display:flex}
  #mobile-bar{display:flex}
  #board-area{padding:8px 6px;padding-bottom:calc(var(--bottom-bar-h) + 8px)}
  #topbar{padding:0 10px;gap:6px}
}
#mobile-topbar-group{display:none}
</style>
</head>
<body>
<div id="app">

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">TacticsPro</span>
  <div class="topbar-sep"></div>

  <!-- Desktop undo/redo -->
  <div class="topbar-group">
    <button class="btn btn-icon" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M3 13C5.4 7.3 11 3.7 17.5 5.1A9 9 0 0 1 21 13"/></svg>
    </button>
    <button class="btn btn-icon" id="btn-redo" title="Redo (Ctrl+Y)" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 7v6h-6"/><path d="M21 13C18.6 7.3 13 3.7 6.5 5.1A9 9 0 0 0 3 13"/></svg>
    </button>
  </div>
  <div class="topbar-sep"></div>

  <!-- Desktop draw tools -->
  <div class="topbar-group" id="draw-toolbar">
    <button class="btn btn-icon active" id="tool-select" title="Select / Move (V)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-4 7z"/></svg>
    </button>
    <button class="btn btn-icon" id="tool-arrow" title="Arrow (A)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
    </button>
    <button class="btn btn-icon" id="tool-line" title="Line (L)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg>
    </button>
    <button class="btn btn-icon" id="tool-curve" title="Curved Arrow (C)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20 C 8 4, 16 4, 20 20"/></svg>
    </button>
    <button class="btn btn-icon" id="tool-zone" title="Zone (Z)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
    </button>
    <input type="color" id="draw-color" value="#22c55e" title="Color">
    <button class="stroke-btn active" data-w="2">—</button>
    <button class="stroke-btn" data-w="4">━</button>
    <button class="stroke-btn" data-w="6">▬</button>
    <button class="btn btn-icon danger" id="btn-clear-draw" title="Clear drawings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
  </div>
  <div class="topbar-sep"></div>

  <!-- Desktop view/export -->
  <div class="topbar-group">
    <button class="btn btn-icon" id="btn-view-toggle" title="Toggle half/full field">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
    </button>
    <button class="btn btn-icon" id="btn-screenshot" title="Export PNG">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>

  <!-- Mobile topbar: undo, redo, export -->
  <div class="topbar-group" id="mobile-topbar-group" style="margin-left:auto;gap:6px">
    <button class="btn btn-icon" id="btn-undo-m" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M3 13C5.4 7.3 11 3.7 17.5 5.1A9 9 0 0 1 21 13"/></svg>
    </button>
    <button class="btn btn-icon" id="btn-redo-m" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 7v6h-6"/><path d="M21 13C18.6 7.3 13 3.7 6.5 5.1A9 9 0 0 0 3 13"/></svg>
    </button>
    <button class="btn btn-icon" id="btn-screenshot-m">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div class="panel-section">
      <div class="panel-title">Formation A</div>
      <div class="formation-grid" id="formations-a"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Team A Color</div>
      <div id="colors-a" class="color-row"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Players A</div>
      <div class="count-row">
        <span class="count-label">Outfield</span>
        <div class="count-ctrl">
          <button id="pa-minus">−</button>
          <span id="pa-count">10</span>
          <button id="pa-plus">+</button>
        </div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);line-height:1.5">Double-click player to name. Drag to move.</div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Formation B</div>
      <div class="formation-grid" id="formations-b"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Team B Color</div>
      <div id="colors-b" class="color-row"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Players B</div>
      <div class="count-row">
        <span class="count-label">Outfield</span>
        <div class="count-ctrl">
          <button id="pb-minus">−</button>
          <span id="pb-count">10</span>
          <button id="pb-plus">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- BOARD -->
  <div id="board-area">
    <div id="field-wrapper">
      <svg id="field-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <canvas id="draw-canvas"></canvas>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <div class="panel-section">
      <div class="panel-title">Tools</div>
      <div class="tool-list">
        <button class="tool-btn active" id="rtool-select"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-4 7z"/></svg>Select & Move</button>
        <button class="tool-btn" id="rtool-arrow"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>Arrow</button>
        <button class="tool-btn" id="rtool-line"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg>Line</button>

        <button class="tool-btn" id="btn-view-toggle-r"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>Half Field</button>

<div id="name-editor">

    <button class="btn active" id="ne-ok" style="flex:1;justify-content:center;padding:8px">OK</button>
    <button class="btn" id="ne-cancel" style="flex:1;justify-content:center;padding:8px">Cancel</button>
  </div>

<script>
// ─── Data ─────────────────────────────────────────────
const FORMATIONS = {
  '4-4-2':  [[.5,.92],[.18,.72],[.38,.72],[.62,.72],[.82,.72],[.15,.5],[.38,.5],[.62,.5],[.85,.5],[.35,.28],[.65,.28]],
  '4-3-3':  [[.5,.92],[.18,.72],[.38,.72],[.62,.72],[.82,.72],[.25,.5],[.5,.5],[.75,.5],[.2,.25],[.5,.2],[.8,.25]],
  '3-5-2':  [[.5,.92],[.25,.75],[.5,.75],[.75,.75],[.12,.52],[.35,.47],[.5,.45],[.65,.47],[.88,.52],[.35,.25],[.65,.25]],
  '4-2-3-1':[[.5,.92],[.18,.72],[.38,.72],[.62,.72],[.82,.72],[.35,.55],[.65,.55],[.2,.35],[.5,.32],[.8,.35],[.5,.18]],
  '5-3-2':  [[.5,.92],[.1,.72],[.28,.72],[.5,.72],[.72,.72],[.9,.72],[.25,.48],[.5,.46],[.75,.48],[.35,.26],[.65,.26]],
  '4-1-4-1':[[.5,.92],[.18,.72],[.38,.72],[.62,.72],[.82,.72],[.5,.6],[.12,.45],[.37,.45],[.63,.45],[.88,.45],[.5,.22]],
};
const TEAM_COLORS = {
  a:['#3b82f6','#22c55e','#a855f7','#f59e0b','#ec4899','#f1f5f9'],
  b:['#ef4444','#f97316','#14b8a6','#64748b','#6366f1','#fbbf24'],
};

const FIELD_W = 105, FIELD_H = 68;
let currentTool = 'select';
let drawColor = '#22c55e';
let drawStroke = 2;
let isHalfView = false;

let players = [], balls = [], drawings = [];
let undoStack = [], redoStack = [];
let teamColors = {a:'#3b82f6', b:'#ef4444'};
let teamFormations = {a:'4-4-2', b:'4-4-2'};
let playerCounts = {a:10, b:10};
let pidCounter = 0, bidCounter = 0;

let dragging = null, dragOffX = 0, dragOffY = 0;
let isDrawing = false, drawStart = null;

// ─── Field rendering ──────────────────────────────────
const fieldSVG = document.getElementById('field-svg');
const boardArea = document.getElementById('board-area');
const fieldWrapper = document.getElementById('field-wrapper');
const drawCanvas = document.getElementById('draw-canvas');
const ctx = drawCanvas.getContext('2d');

function computeFieldSize() {
  const aw = boardArea.clientWidth - 20, ah = boardArea.clientHeight - 20;
  const aspect = isHalfView ? FIELD_W / (FIELD_H/2) : FIELD_W / FIELD_H;
  let w = aw, h = w / aspect;
  if (h > ah) { h = ah; w = h * aspect; }
  return { w: Math.floor(w), h: Math.floor(h) };
}

function buildFieldSVG() {
  const {w, h} = computeFieldSize();
  fieldSVG.setAttribute('width', w);
  fieldSVG.setAttribute('height', h);
  const VH = isHalfView ? FIELD_H/2 : FIELD_H;
  fieldSVG.setAttribute('viewBox', `0 0 ${FIELD_W} ${VH}`);
  drawCanvas.width = w; drawCanvas.height = h;
  drawCanvas.style.width = w+'px'; drawCanvas.style.height = h+'px';

  const lc = 'rgba(255,255,255,.55)', lw = .35;
  let s = `<defs>
    <pattern id="grass" x="0" y="0" width="10.5" height="10" patternUnits="userSpaceOnUse">
      <rect width="10.5" height="10" fill="#2d8a4e"/><rect width="10.5" height="5" fill="#2a7f48"/>
    </pattern>
  </defs>
  <rect width="${FIELD_W}" height="${VH}" fill="url(#grass)"/>
  <rect x="2.5" y="2.5" width="${FIELD_W-5}" height="${VH-5}" fill="none" stroke="${lc}" stroke-width="${lw}"/>`;

  if (!isHalfView) {
    s += `<line x1="2.5" y1="${VH/2}" x2="${FIELD_W-2.5}" y2="${VH/2}" stroke="${lc}" stroke-width="${lw}"/>
    <circle cx="${FIELD_W/2}" cy="${VH/2}" r="9.15" fill="none" stroke="${lc}" stroke-width="${lw}"/>
    <circle cx="${FIELD_W/2}" cy="${VH/2}" r=".6" fill="${lc}"/>`;
  }

  function box(y0, flip) {
    const d = flip ? -1 : 1, bH=16.5, bW=40.32, sH=5.5, sW=18.32;
    const bx=(FIELD_W-bW)/2, sx=(FIELD_W-sW)/2;
    s += `<rect x="${bx}" y="${Math.min(y0,y0+d*bH)}" width="${bW}" height="${bH}" fill="none" stroke="${lc}" stroke-width="${lw}"/>
    <rect x="${sx}" y="${Math.min(y0,y0+d*sH)}" width="${sW}" height="${sH}" fill="none" stroke="${lc}" stroke-width="${lw}"/>
    <circle cx="${FIELD_W/2}" cy="${y0+d*11}" r=".6" fill="${lc}"/>
    <path d="M${FIELD_W/2-9} ${y0+d*16.5} A 9.15 9.15 0 0 ${flip?0:1} ${FIELD_W/2+9} ${y0+d*16.5}" fill="none" stroke="${lc}" stroke-width="${lw}"/>
    <rect x="${FIELD_W/2-3.66}" y="${Math.min(y0,y0-d*2)}" width="7.32" height="2" fill="rgba(255,255,255,.1)" stroke="${lc}" stroke-width="${lw}"/>`;
    // corner arcs
    [[2.5,y0,flip?0:1],[FIELD_W-2.5,y0,flip?1:0]].forEach(([cx,cy,sw]) => {
      s += `<path d="M${cx} ${cy+d} A 1 1 0 0 ${sw} ${cx+(cx<FIELD_W/2?1:-1)} ${cy}" fill="none" stroke="${lc}" stroke-width="${lw}"/>`;
    });
  }

  if (isHalfView) {
    box(2.5, false);
    s += `<line x1="2.5" y1="${VH-2.5}" x2="${FIELD_W-2.5}" y2="${VH-2.5}" stroke="${lc}" stroke-width="${lw}" stroke-dasharray="1,1" opacity=".4"/>`;
    s += `<path d="M${(FIELD_W-18.3)/2} ${VH} A 9.15 9.15 0 0 1 ${(FIELD_W+18.3)/2} ${VH}" fill="none" stroke="${lc}" stroke-width="${lw}"/>`;
  } else {
    box(2.5, false);
    box(VH-2.5, true);
  }

  fieldSVG.innerHTML = s;
}

// ─── Player helpers ───────────────────────────────────
function createPlayer(team, x, y, num, isGK) {
  return {id:++pidCounter, team, x, y, num, name:'', isGK:!!isGK};
}

function applyFormation(team, key) {
  const pos = FORMATIONS[key] || FORMATIONS['4-4-2'];
  const gkExist = players.find(p=>p.team===team&&p.isGK);
  const outExist = players.filter(p=>p.team===team&&!p.isGK);
  const count = playerCounts[team];
  const flip = team === 'b';

  const gx = flip ? 1-pos[0][0] : pos[0][0];
  const gy = flip ? 1-pos[0][1] : pos[0][1];
  if (gkExist) { gkExist.x=gx; gkExist.y=gy; }
  else players.push(createPlayer(team,gx,gy,1,true));

  for (let i=0;i<count;i++) {
    const src = pos[i+1] || [.5,.5];
    const px = flip ? 1-src[0] : src[0];
    const py = flip ? 1-src[1] : src[1];
    if (outExist[i]) { outExist[i].x=px; outExist[i].y=py; }
    else players.push(createPlayer(team,px,py,i+2));
  }
  players = players.filter(p=>p.team!==team||p.isGK||players.filter(q=>q.team===team&&!q.isGK).indexOf(p)<count);
  renderPlayers(); updateMinimap();
}

function initTeam(t) {
  players = players.filter(p=>p.team!==t);
  applyFormation(t, teamFormations[t]);
}

// ─── Token rendering ──────────────────────────────────
function tokenR() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--token-r')) || 18;
}

function renderPlayers() {
  document.querySelectorAll('.player-token,.ball-token').forEach(e=>e.remove());
  const {w,h} = computeFieldSize();
  const r = tokenR();

  players.forEach(p => {
    const el = document.createElement('div');
    el.className = `player-token ${p.isGK?'gk':'team-'+p.team}`;
    if (!p.isGK) el.style.background = `radial-gradient(circle at 35% 35%,${teamColors[p.team]},${darken(teamColors[p.team],.4)})`;
    const cx = p.x*w, cy = mapY(p.y,h);
    el.style.left = (cx-r)+'px';
    el.style.top = (cy-r)+'px';
    el.textContent = p.isGK ? 'GK' : p.num;
    el.dataset.id = p.id;
    if (p.name) {
      const tag = document.createElement('div');
      tag.className = 'name-tag';
      tag.textContent = p.name;
      el.appendChild(tag);
    }
    fieldWrapper.appendChild(el);
    attachDrag(el, 'player');
    // double-click / long-press for name
    let pressTimer;
    el.addEventListener('pointerdown', () => { pressTimer = setTimeout(()=>openNameEditor(p,el), 600); });
    el.addEventListener('pointerup', () => clearTimeout(pressTimer));
    el.addEventListener('pointermove', () => clearTimeout(pressTimer));
    el.addEventListener('dblclick', () => { clearTimeout(pressTimer); openNameEditor(p,el); });
  });

  balls.forEach(b => {
    const el = document.createElement('div');
    el.className = 'ball-token';
    el.style.left = (b.x*w - 14)+'px';
    el.style.top = (mapY(b.y,h) - 14)+'px';
    el.dataset.bid = b.id;
    fieldWrapper.appendChild(el);
    attachDrag(el, 'ball');
  });
}

function mapY(yPct, h) {
  return isHalfView ? yPct * h * 2 : yPct * h;
}
function unmapY(py, h) {
  return isHalfView ? py / (h*2) : py / h;
}

// ─── Drag ─────────────────────────────────────────────
function attachDrag(el, type) {
  const isBall = type === 'ball';
  const offset = isBall ? 14 : tokenR();

  el.addEventListener('pointerdown', e => {
    if (currentTool !== 'select') return;
    e.preventDefault(); e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    const rect = fieldWrapper.getBoundingClientRect();
    dragging = {el, type};
    dragOffX = e.clientX - rect.left - parseInt(el.style.left) - offset;
    dragOffY = e.clientY - rect.top - parseInt(el.style.top) - offset;
    saveUndo();
  });

  el.addEventListener('pointermove', e => {
    if (!dragging || dragging.el !== el) return;
    e.preventDefault();
    const rect = fieldWrapper.getBoundingClientRect();
    const {w,h} = computeFieldSize();
    let nx = e.clientX - rect.left - dragOffX - offset;
    let ny = e.clientY - rect.top - dragOffY - offset;
    nx = Math.max(-offset, Math.min(w-offset, nx));
    ny = Math.max(-offset, Math.min(h-offset, ny));
    el.style.left = nx+'px';
    el.style.top = ny+'px';
    const cx = nx+offset, cy = ny+offset;
    if (type==='player') {
      const p = players.find(q=>q.id===parseInt(el.dataset.id));
      if (p) { p.x=cx/w; p.y=unmapY(cy,h); }
    } else {
      const b = balls.find(q=>q.id===parseInt(el.dataset.bid));
      if (b) { b.x=cx/w; b.y=unmapY(cy,h); }
    }
    updateMinimap();
  });

  el.addEventListener('pointerup', () => {
    el.classList.remove('dragging');
    dragging = null;
  });
}

// ─── Drawing ──────────────────────────────────────────
function getCP(e) {
  const r = drawCanvas.getBoundingClientRect();
  return {x: e.clientX-r.left, y: e.clientY-r.top};
}

drawCanvas.addEventListener('pointerdown', e => {
  if (currentTool==='select') return;
  e.preventDefault();
  drawCanvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  drawStart = getCP(e);
  saveUndo();
});

drawCanvas.addEventListener('pointermove', e => {
  if (!isDrawing) return;
  const pos = getCP(e);
  redrawCanvas();
  ctx.save();
  ctx.strokeStyle = drawColor; ctx.lineWidth = drawStroke;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash(currentTool==='zone' ? [4,3] : []);
  previewDraw(ctx, drawStart, pos);
  ctx.restore();
});

drawCanvas.addEventListener('pointerup', e => {
  if (!isDrawing) return;
  isDrawing = false;
  const end = getCP(e);
  drawings.push({tool:currentTool, color:drawColor, stroke:drawStroke, sx:drawStart.x, sy:drawStart.y, ex:end.x, ey:end.y});
  redrawCanvas();
});

function previewDraw(c, s, e) {
  if (currentTool==='line'||currentTool==='arrow') {
    c.beginPath(); c.moveTo(s.x,s.y); c.lineTo(e.x,e.y); c.stroke();
    if (currentTool==='arrow') arrowHead(c,s.x,s.y,e.x,e.y);
  } else if (currentTool==='zone') {
    c.strokeRect(s.x,s.y,e.x-s.x,e.y-s.y);
    c.fillStyle=drawColor+'18'; c.fillRect(s.x,s.y,e.x-s.x,e.y-s.y);
  } else if (currentTool==='curve') {
    const cp={x:(s.x+e.x)/2, y:Math.min(s.y,e.y)-Math.abs(e.x-s.x)*.35-20};
    c.beginPath(); c.moveTo(s.x,s.y); c.quadraticCurveTo(cp.x,cp.y,e.x,e.y); c.stroke();
    arrowHead(c,cp.x,cp.y,e.x,e.y);
  }
}

function arrowHead(c,x1,y1,x2,y2) {
  const angle = Math.atan2(y2-y1,x2-x1);
  const size = Math.max(9, drawStroke*3.5);
  c.save(); c.fillStyle=drawColor;
  c.beginPath(); c.translate(x2,y2); c.rotate(angle);
  c.moveTo(0,0); c.lineTo(-size,-size/2.5); c.lineTo(-size,size/2.5);
  c.closePath(); c.fill(); c.restore();
}

function redrawCanvas() {
  ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  drawings.forEach(d => {
    ctx.save();
    ctx.strokeStyle=d.color; ctx.lineWidth=d.stroke;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.setLineDash(d.tool==='zone'?[4,3]:[]);
    previewDraw(ctx,{x:d.sx,y:d.sy},{x:d.ex,y:d.ey});
    ctx.restore();
  });
}

// ─── Tool switching ───────────────────────────────────
function setTool(t) {
  currentTool = t;
  const isSel = t === 'select';
  drawCanvas.classList.toggle('drawing', !isSel);
  ['select','arrow','line','curve','zone'].forEach(n=>{
    document.getElementById('tool-'+n)?.classList.toggle('active',n===t);
    document.getElementById('rtool-'+n)?.classList.toggle('active',n===t);
  });
  ['select','arrow','curve','zone'].forEach(n=>{
    document.getElementById('mb-'+n)?.classList.toggle('active',n===t);
  });
  document.querySelectorAll('.player-token,.ball-token').forEach(el=>{
    el.style.pointerEvents = isSel ? 'all' : 'none';
  });
}

// ─── Undo/Redo ────────────────────────────────────────
function saveUndo() {
  undoStack.push(JSON.stringify({players,balls,drawings}));
  if (undoStack.length>60) undoStack.shift();
  redoStack=[];
  updateUndoBtns();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify({players,balls,drawings}));
  const s=JSON.parse(undoStack.pop());
  players=s.players; balls=s.balls; drawings=s.drawings;
  renderPlayers(); redrawCanvas(); updateUndoBtns(); updateMinimap();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify({players,balls,drawings}));
  const s=JSON.parse(redoStack.pop());
  players=s.players; balls=s.balls; drawings=s.drawings;
  renderPlayers(); redrawCanvas(); updateUndoBtns(); updateMinimap();
}
function updateUndoBtns() {
  const u = undoStack.length===0;
  const r = redoStack.length===0;
  document.getElementById('btn-undo').disabled = u;
  document.getElementById('btn-redo').disabled = r;
  document.getElementById('btn-undo-m').disabled = u;
  document.getElementById('btn-redo-m').disabled = r;
}

// ─── Minimap ──────────────────────────────────────────
function updateMinimap() {
  const mm = document.getElementById('minimap-players');
  mm.innerHTML='';
  const el = document.getElementById('minimap');
  const mw=el.clientWidth, mh=el.clientHeight;
  [...players,...balls].forEach(p=>{
    const dot=document.createElement('div');
    dot.style.cssText='position:absolute;border-radius:50%';
    if (p.team) {
      dot.style.cssText += ';width:8px;height:8px';
      dot.style.background = p.isGK ? '#f59e0b' : teamColors[p.team];
      dot.style.left=(p.x*mw-4)+'px';
      dot.style.top=(p.y*mh-4)+'px';
      dot.style.boxShadow='0 0 3px rgba(0,0,0,.5)';
    } else {
      dot.style.cssText += ';width:5px;height:5px;background:#fff';
      dot.style.left=(p.x*mw-2.5)+'px';
      dot.style.top=(p.y*mh-2.5)+'px';
    }
    mm.appendChild(dot);
  });
}

// ─── Color/formation UI ───────────────────────────────
function buildFormationUI(team) {
  const c=document.getElementById(`formations-${team}`);
  c.innerHTML='';
  Object.keys(FORMATIONS).forEach(k=>{
    const b=document.createElement('button');
    b.className='formation-btn'+(teamFormations[team]===k?' active':'');
    b.textContent=k;
    b.addEventListener('click',()=>{
      teamFormations[team]=k;
      c.querySelectorAll('.formation-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      saveUndo();
      players=players.filter(p=>p.team!==team);
      applyFormation(team,k);
    });
    c.appendChild(b);
  });
}

function buildColorUI(team) {
  const c=document.getElementById(`colors-${team}`);
  c.innerHTML='';
  TEAM_COLORS[team].forEach(col=>{

function setCount(team, d) {
  const n=Math.max(1,Math.min(10,playerCounts[team]+d));
  if (n===playerCounts[team]) return;
  saveUndo();
  playerCounts[team]=n;
  document.getElementById(`p${team}-count`).textContent=n;
  players=players.filter(p=>p.team!==team);
  applyFormation(team,teamFormations[team]);
}

function exportPNG() {
  const {w,h}=computeFieldSize();
  const ec2=document.createElement('canvas');
  ec2.width=w; ec2.height=h;
  const ectx=ec2.getContext('2d');
  const svgData=new XMLSerializer().serializeToString(fieldSVG);
  const img=new Image();
  img.onload=()=>{
    ectx.drawImage(img,0,0);
    const r=tokenR();
    players.forEach(p=>{
      const cx=p.x*w, cy=mapY(p.y,h);
      ectx.save();
      const col=p.isGK?'#f59e0b':teamColors[p.team];
      const g=ectx.createRadialGradient(cx-r*.35,cy-r*.35,2,cx,cy,r);
      g.addColorStop(0,lighten(col,.3)); g.addColorStop(1,darken(col,.4));
      ectx.fillStyle=g;
      ectx.beginPath(); ectx.arc(cx,cy,r,0,Math.PI*2); ectx.fill();
      ectx.strokeStyle='rgba(255,255,255,.6)'; ectx.lineWidth=2; ectx.stroke();
      ectx.fillStyle='#fff';
      ectx.font=`bold ${Math.round(r*.75)}px Barlow Condensed,sans-serif`;
      ectx.textAlign='center'; ectx.textBaseline='middle';
      ectx.fillText(p.isGK?'GK':p.num,cx,cy);
      if(p.name){ectx.font=`${Math.round(r*.55)}px Barlow,sans-serif`;ectx.fillText(p.name,cx,cy+r+10);}
      ectx.restore();
    });
    balls.forEach(b=>{
      const cx=b.x*w, cy=mapY(b.y,h);
      ectx.save();
      const g=ectx.createRadialGradient(cx-4,cy-4,1,cx,cy,13);
      g.addColorStop(0,'#fff'); g.addColorStop(1,'#9ca3af');
      ectx.fillStyle=g; ectx.beginPath(); ectx.arc(cx,cy,13,0,Math.PI*2); ectx.fill();
      ectx.restore();
    });
    ectx.drawImage(drawCanvas,0,0);
    const a=document.createElement('a');
    a.href=ec2.toDataURL('image/png'); a.download='tactics.png'; a.click();
  };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgData)));
}
document.getElementById('btn-screenshot').addEventListener('click',exportPNG);
document.getElementById('btn-screenshot-m').addEventListener('click',exportPNG);

// ─── Bottom sheet ─────────────────────────────────────
const backdrop = document.getElementById('sheet-backdrop');
const sheet = document.getElementById('bottom-sheet');
const sheetBody = document.getElementById('sheet-body');
let sheetOpen = false;

function openSheet(tab) {
  sheetOpen=true;
  backdrop.style.display='block';
  requestAnimationFrame(()=>{
    backdrop.classList.add('open');
    sheet.classList.add('open');
  });
  document.querySelectorAll('.sheet-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  renderSheetTab(tab);
}
function closeSheet() {
  sheetOpen=false;
  backdrop.classList.remove('open');
  sheet.classList.remove('open');
  setTimeout(()=>{ backdrop.style.display='none'; },280);
}
backdrop.addEventListener('click',closeSheet);

document.querySelectorAll('.sheet-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.sheet-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    renderSheetTab(t.dataset.tab);
  });
});

function renderSheetTab(tab) {
  if (tab==='team-a'||tab==='team-b') {
    const team = tab==='team-a'?'a':'b';
    const label = tab==='team-a'?'A':'B';
    sheetBody.innerHTML=`
      <div class="sheet-section">
        <div class="sheet-title">Formation ${label}</div>
        <div class="sheet-formation-grid" id="sheet-form-${team}"></div>
      </div>
      <div class="sheet-section">
        <div class="sheet-title">Color</div>
        <div class="sheet-colors" id="sheet-col-${team}"></div>
      </div>
      <div class="sheet-section">
        <div class="sheet-title">Outfield Players</div>
        <div class="sheet-count-row">
          <span class="sheet-count-label">Count</span>
          <div class="sheet-count-ctrl">
            <button id="sheet-p${team}-m">−</button>
            <span id="sheet-p${team}-n">${playerCounts[team]}</span>
            <button id="sheet-p${team}-p">+</button>
          </div>
        </div>
      </div>`;
    // Formation buttons
    const fg=document.getElementById(`sheet-form-${team}`);
    Object.keys(FORMATIONS).forEach(k=>{
      const b=document.createElement('button');
      b.className='sheet-formation-btn'+(teamFormations[team]===k?' active':'');
      b.textContent=k;
      b.addEventListener('click',()=>{
        teamFormations[team]=k;
        fg.querySelectorAll('.sheet-formation-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        saveUndo(); players=players.filter(p=>p.team!==team); applyFormation(team,k);
        buildFormationUI(team);
      });
      fg.appendChild(b);
    });
    // Color swatches
    const cg=document.getElementById(`sheet-col-${team}`);
    TEAM_COLORS[team].forEach(col=>{
      const sw=document.createElement('div');
      sw.className='sheet-swatch'+(col===teamColors[team]?' active':'');
      sw.style.background=col;
      sw.addEventListener('click',()=>{
        teamColors[team]=col;
        cg.querySelectorAll('.sheet-swatch').forEach(s=>s.classList.remove('active'));
        sw.classList.add('active');
        renderPlayers();
        buildColorUI(team);
      });
      cg.appendChild(sw);
    });
    // Count
    document.getElementById(`sheet-p${team}-m`).addEventListener('click',()=>{
      setCount(team,-1);
      document.getElementById(`sheet-p${team}-n`).textContent=playerCounts[team];
    });
    document.getElementById(`sheet-p${team}-p`).addEventListener('click',()=>{
      setCount(team,+1);
      document.getElementById(`sheet-p${team}-n`).textContent=playerCounts[team];
    });
  } else if (tab==='draw') {
    sheetBody.innerHTML=`
      <div class="sheet-section">
        <div class="sheet-title">Color</div>
        <div class="sheet-draw-row">
          <input type="color" id="sheet-draw-color" value="${drawColor}">
          <span style="font-size:13px;color:var(--text-muted)">Pick color</span>
        </div>
      </div>
      <div class="sheet-section">
        <div class="sheet-title">Stroke Width</div>
        <div class="sheet-draw-row">
          <button class="sheet-stroke-btn${drawStroke===2?' active':''}" data-sw="2">Thin</button>
          <button class="sheet-stroke-btn${drawStroke===4?' active':''}" data-sw="4">Medium</button>
          <button class="sheet-stroke-btn${drawStroke===6?' active':''}" data-sw="6">Thick</button>
        </div>
      </div>`;
    document.getElementById('sheet-draw-color').addEventListener('input',e=>{
      drawColor=e.target.value;
      document.getElementById('draw-color').value=drawColor;
    });
    document.querySelectorAll('.sheet-stroke-btn[data-sw]').forEach(b=>{
      b.addEventListener('click',()=>{
        drawStroke=parseInt(b.dataset.sw);
        document.querySelectorAll('.sheet-stroke-btn[data-sw]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        document.querySelectorAll('.stroke-btn[data-w="'+drawStroke+'"]').forEach(x=>{
          document.querySelectorAll('.stroke-btn[data-w]').forEach(y=>y.classList.remove('active'));
          x.classList.add('active');
        });
      });
    });
  } else if (tab==='actions') {
    sheetBody.innerHTML=`
      <div class="sheet-action-grid">
        <button class="sheet-action-btn" id="sh-reset">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 3 6.7"/><polyline points="3 3 3 9 9 9"/></svg>Reset Positions
        </button>
        <button class="sheet-action-btn" id="sh-flip">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3L4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>Flip Teams
        </button>
        <button class="sheet-action-btn" id="sh-ball">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>Add Ball
        </button>
        <button class="sheet-action-btn" id="sh-half">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>${isHalfView?'Full Field':'Half Field'}
        </button>
        <button class="sheet-action-btn danger" id="sh-clear" style="grid-column:span 2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l11-11 6 6-3.5 3.5"/><path d="M6.5 17.5l3-3"/></svg>Clear Drawings
        </button>
      </div>`;
    document.getElementById('sh-reset').addEventListener('click',()=>{
      saveUndo(); players=[]; applyFormation('a',teamFormations['a']); applyFormation('b',teamFormations['b']); closeSheet();
    });
    document.getElementById('sh-flip').addEventListener('click',()=>{
      saveUndo(); players.forEach(p=>{p.x=1-p.x;p.y=1-p.y;}); renderPlayers(); updateMinimap(); closeSheet();
    });
    document.getElementById('sh-ball').addEventListener('click',()=>{ saveUndo(); addBall(); closeSheet(); });
    document.getElementById('sh-half').addEventListener('click',()=>{ toggleHalf(); closeSheet(); });
    document.getElementById('sh-clear').addEventListener('click',()=>{ saveUndo(); drawings=[]; redrawCanvas(); closeSheet(); });
  }
}

// ─── Keyboard ─────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if ((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  if ((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();redo();}
  if (e.key==='v'||e.key==='Escape') setTool('select');
  if (e.key==='a') setTool('arrow');
  if (e.key==='l') setTool('line');
  if (e.key==='c') setTool('curve');
  if (!e.ctrlKey&&!e.metaKey&&e.key==='z') setTool('zone');
});

  clearTimeout(resizeT);

// ─── Helpers ──────────────────────────────────────────
function darken(hex,a){return adjHex(hex,c=>Math.max(0,Math.floor(c*(1-a))));}
function lighten(hex,a){return adjHex(hex,c=>Math.min(255,Math.floor(c+(255-c)*a)));}
function adjHex(hex,fn){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `#${[fn(r),fn(g),fn(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}`;
}
